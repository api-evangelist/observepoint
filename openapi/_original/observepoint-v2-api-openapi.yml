openapi: 3.0.0
info:
  description: ''
  title: V2 API
  version: null
paths:
  /account:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/account</div>
      operationId: getAccount
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Returns account for current user
      tags:
        - Account
  /domains:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/domains</div>
      operationId: getDomains
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Domain'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Get list of all sub-folders
      tags:
        - Sub-Folders
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/domains</div>
      operationId: createDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDomain'
        description: New sub-folder info
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Create new sub-folder
      tags:
        - Sub-Folders
  /domains/{domainId}:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/domains/<span class="op-path-parameter">{domainId}</span></div>
      operationId: getDomain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get sub-folder by id
      tags:
        - Sub-Folders
    put:
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v2/domains/<span class="op-path-parameter">{domainId}</span></div>
      operationId: updateDomain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainUpdate'
        description: Sub-folder update information
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Update sub-folder with given id
      tags:
        - Sub-Folders
    delete:
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v2/domains/<span
        class="op-path-parameter">{domainId}</span></div>
      operationId: deleteDomain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Item was successfully deleted
        '423':
          description: >-
            Following items are still running. Please stop & discard their
            active runs first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsAreRunningApiError'
      security:
        - API_Key: []
      summary: Delete sub-folder with given id
      tags:
        - Sub-Folders
  /domains/{domainId}/web-audits:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/domains/<span
        class="op-path-parameter">{domainId}</span>/web-audits</div>
      operationId: getAudits
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: withRuns
          in: query
          required: true
          schema:
            type: boolean
        - name: runsLimit
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Audit'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get web audits for sub-folder with given id
      tags:
        - Sub-Folders
  /domains/{domainId}/web-journeys:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/domains/<span
        class="op-path-parameter">{domainId}</span>/web-journeys</div>
      operationId: getWebJourneys
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WebJourney'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get web journeys for sub-folder with given id
      tags:
        - Sub-Folders
  /folders:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/folders</div>
      operationId: getFolders
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Folder'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Get list of all folders
      tags:
        - Folders
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/folders</div>
      operationId: createFolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFolder'
        description: Folder create information
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Create new folder
      tags:
        - Folders
  /folders/{folderId}:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/folders/<span class="op-path-parameter">{folderId}</span></div>
      operationId: findFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '403':
          description: Don't have permissions to access this folder
        '404':
          description: Folder by given id not found
      security:
        - API_Key: []
      summary: Get folder by given id
      tags:
        - Folders
    put:
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v2/folders/<span class="op-path-parameter">{folderId}</span></div>
      operationId: updateFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolder'
        description: Folder update information
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '403':
          description: Don't have permissions to access this folder
        '404':
          description: Folder by given id not found
      security:
        - API_Key: []
      summary: Update folder with given id
      tags:
        - Folders
    delete:
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v2/folders/<span
        class="op-path-parameter">{folderId}</span></div>
      operationId: deleteFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Item was successfully deleted
        '403':
          description: Don't have permissions to access this folder
        '404':
          description: Folder by given id not found
        '423':
          description: >-
            Following items are still running. Please stop & discard their
            active runs first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsAreRunningApiError'
      security:
        - API_Key: []
      summary: Delete folder with given id
      tags:
        - Folders
  /folders/{folderId}/users:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/folders/<span
        class="op-path-parameter">{folderId}</span>/users</div>
      operationId: GetUsersWithFolderId
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
        '403':
          description: Don't have permissions to access this folder
        '404':
          description: Folder by given id not found
      security:
        - API_Key: []
      summary: Get users of folder with given id
      tags:
        - Folders
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/folders/<span
        class="op-path-parameter">{folderId}</span>/users</div>
      operationId: addUsers
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              items:
                format: int32
                type: integer
              type: array
        description: List of users ids
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
        '403':
          description: Don't have permissions to access this folder
        '404':
          description: Folder by given id not found
      security:
        - API_Key: []
      summary: Add users to folder with given id
      tags:
        - Folders
  /labels:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/labels</div>
      operationId: getLabels
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LabelWithSignedItems'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Get list of all labels
      tags:
        - Labels
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/labels</div>
      operationId: createNewLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabel'
        description: New label info
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelWithSignedItems'
        '403':
          description: Duplicate name
        '422':
          description: Empty name
      security:
        - API_Key: []
      summary: Create new label
      tags:
        - Labels
  /labels/{labelId}:
    put:
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v2/labels/<span class="op-path-parameter">{labelId}</span></div>
      operationId: updateLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLabel'
        description: Updated label info
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelWithSignedItems'
        '403':
          description: Duplicate name
        '404':
          description: Label with such id doesn't exist in your account
        '422':
          description: Empty name
      security:
        - API_Key: []
      summary: Update existing label name
      tags:
        - Labels
    delete:
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v2/labels/<span
        class="op-path-parameter">{labelId}</span></div>
      operationId: deleteALabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Label deleted
        '404':
          description: There is no label with id labelid
      security:
        - API_Key: []
      summary: Delete label with given id
      tags:
        - Labels
  /manual-journeys:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/manual-journeys</div>
      operationId: allJourneys
      requestBody:
        $ref: '#/components/requestBodies/SeqValue'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Journey'
                type: array
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Get all manual journeys
      tags:
        - Manual Journeys
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/manual-journeys</div>
      operationId: createJourney
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
        description: New manual journey info
        required: true
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Create new manual journey
      tags:
        - Manual Journeys
  /manual-journeys/certificates/default:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/manual-journeys/certificates/default</div>
      operationId: observepoint$api$manualjourney$ManualJourneyRoute$$getDefaultCertificate
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: Get default certificate metadata
      tags:
        - Manual Journeys
  /manual-journeys/{manualJourneyId}:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span></div>
      operationId: journey
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get manual journey
      tags:
        - Manual Journeys
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span></div>
      operationId: initialize
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializedJourney'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Initialize manual journey run
      tags:
        - Manual Journeys
    put:
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span></div>
      operationId: updateJourney
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
        description: Update manual journey info
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
        '422':
          description: Supplied entity didn't pass a validation
      security:
        - API_Key: []
      summary: Update manual journey
      tags:
        - Manual Journeys
    delete:
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span></div>


        See also POST /v2/manual-journeys/{manualJourneyId}/delete for an
        equivalent endpoint that supports browser sendBeacon() calls.
      operationId: deleteJourney
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Item was successfully deleted
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
        '423':
          description: This item has active run. Please stop & discard active run first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemIsRunningApiError'
      security:
        - API_Key: []
      summary: Delete manual journey
      tags:
        - Manual Journeys
  /manual-journeys/{manualJourneyId}/delete:
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span>/delete</div>


        This endpoint provides the same functionality as DELETE
        /v2/manual-journeys/{manualJourneyId}. It exists to support browser
        sendBeacon() calls, which can only perform POST requests. This is used
        when users abruptly leave the live-connect page to ensure proper cleanup
        of the live-connect session (including stopping any ECS tasks associated
        with the run and removing the run from the database).
      operationId: deleteJourneyViaPost
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Item was successfully deleted
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
        '423':
          description: This item has active run. Please stop & discard active run first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemIsRunningApiError'
      security:
        - API_Key: []
      summary: Delete manual journey via POST request
      tags:
        - Manual Journeys
  /manual-journeys/{manualJourneyId}/har-runs:
    post:
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span>/har-runs</div>
      operationId: createHarRun
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarJourneyRunCreateRequest'
        description: New har manual journey request
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                format: int64
                type: integer
        '401':
          description: Authentication credentials are missing or invalid
      security:
        - API_Key: []
      summary: >-
        Create a manual journey run within the manualJourneyId based on uploaded
        har files.
      tags:
        - Manual Journeys
  /manual-journeys/{manualJourneyId}/labels:
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span>/labels</div>
      operationId: journeyLabels
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: number
                type: array
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get manual journey labels
      tags:
        - Manual Journeys
    put:
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span>/labels</div>
      operationId: updateJourneyLabels
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        $ref: '#/components/requestBodies/LabelArray'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                items:
                  type: number
                type: array
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Update manual journey labels
      tags:
        - Manual Journeys
  /manual-journeys/{manualJourneyId}/labels/{labelId}:
    delete:
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v2/manual-journeys/<span
        class="op-path-parameter">{manualJourneyId}</span>/labels/<span
        class="op-path-parameter">{labelId}</span></div>
      operationId: deleteJourneyLabel
      parameters:
        - name: manualJourneyId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Item was successfully deleted
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Delete manual journey label
      tags:
        - Manual Journeys
