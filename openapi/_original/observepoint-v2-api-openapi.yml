    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v2/web-audits/<span
        class="op-path-parameter">{webAuditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/pages/<span
        class="op-path-parameter">{pageId}</span>/rule-results</div>
      operationId: getPageRuleResults
      parameters:
        - name: webAuditId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRuleResults'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Requested item not found
      security:
        - API_Key: []
      summary: Get rule results for page
      tags:
        - Audits
tags:
  - description: >-
      Endpoints for managing account settings, configurations, and account-level
      information
    name: Account
  - description: >-
      Endpoints for managing rules including creation, configuration,
      assignment, and rule-based validation logic
    name: Rules
  - description: >-
      Endpoints for managing tags and tag-related operations including tag
      metadata and configuration
    name: Tags
  - description: >-
      Endpoints for managing users including creation, authentication,
      permissions, and user account management
    name: Users
  - description: >-
      Endpoints for managing manual journeys including real device testing, HAR
      file ingestion, and journey execution control. These endpoints power Live
      Connect and HAR Analyzer features in the ObservePoint UI, enabling users
      to perform manual testing on real devices and analyze HAR files for tag
      validation and troubleshooting.


      For more information, see the [HAR File Processing API
      Recipe](/sections/api-recipes/har-file-processing).
    name: Manual Journeys
  - description: >-
      Endpoints for managing folders including creation, organization, access
      control, and folder-based resource management
    name: Folders
  - description: >-
      Endpoints for managing sub-folders including creation, configuration, and
      sub-folder-based audit and journey management
    name: Sub-Folders
  - description: >-
      Endpoints for managing audits including creation, configuration,
      execution, and retrieving audit results and runs
    name: Audits
  - description: >-
      Endpoints for managing labels including creation, assignment, and
      retrieval for organizing audits, journeys, and other resources
    name: Labels
