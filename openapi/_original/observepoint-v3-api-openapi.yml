      type: integer
      format: int64
    CmpCookieGroups:
      type: object
      required:
        - requestId
        - accountId
        - created
        - status
        - cmpProvider
        - sourceUrl
        - locale
        - groups
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        accountId:
          $ref: '#/components/schemas/AccountId'
        created:
          $ref: '#/components/schemas/timestamp'
        status:
          $ref: '#/components/schemas/CmpCookieGroupStatus'
        errorMessage:
          type: string
          description: (Optional) Present if status is FAILURE
        cmpProvider:
          type: string
          description: CMP provider
          enum:
            - ONE_TRUST
        domain:
          type: string
          description: Domain to which the gathered cookie groups are related
        sourceUrl:
          type: string
          description: URL of the page where the CMP data was harvested
        locale:
          type: string
          description: >-
            An ISO-3166 alpha-2 country code or 'US' followed by a 2 letter
            state code separated by comma
        groups:
          type: array
          description: Array of CMP cookie groups
          items:
            $ref: '#/components/schemas/CmpCookieGrouping'
    CmpCookieGroupStatus:
      type: string
      description: Status of the CMP data harvest request
      enum:
        - PROCESSING
        - COMPLETE
        - FAILURE
    CmpCookieGrouping:
      type: object
      description: A consent group containing cookies assigned to the group
      required:
        - groupId
        - groupName
        - cookies
        - status
      properties:
        groupId:
          type: string
        groupName:
          type: string
        status:
          type: string
          description: >-
            The current status of the CMP group on the domain. e.g. "always
            active", "active", "inactive".
        cookies:
          type: array
          description: The cookies in the consent group
          items:
            $ref: '#/components/schemas/CmpCookieDefinition'
    CmpCookieDefinition:
      type: object
      required:
        - domain
        - regexDomain
        - name
      properties:
        domain:
          type: string
          description: The raw domain of the cookie as reported by the CMP
        regexDomain:
          type: string
          description: The cookie domain with regex applied to include any subdomains
        name:
          type: string
        nameIsRegex:
          type: boolean
          default: false
          description: >-
            Indicates if the cookie name should be treated as a regular
            expression
        description:
          type: string
    HarRequest:
      type: object
      properties:
