    AccountUsageV2_SpecificItemTypeSummary_WebJourneyUsage:
      x-discriminator-value: WEB_JOURNEY
      allOf:
        - $ref: >-
            #/components/schemas/AccountUsageV2_SpecificItemTypeSummary_BaseUsage
        - type: object
          required:
            - supportUsage
          properties:
            supportUsage:
              $ref: >-
                #/components/schemas/AccountUsageV2_SpecificItemTypeSummary_WebJourneySupportUsage
    AccountUsageV2_SpecificItemTypeSummary_WebJourneySupportUsage:
      type: object
      description: >
        `maxMonitoredWebJourneys` and `remainingWebJourneySupportRequests` can
        be omitted if there is no limit

