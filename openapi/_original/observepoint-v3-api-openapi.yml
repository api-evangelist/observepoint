        - itemType
        - itemIds
      properties:
        itemType:
          $ref: >-
            #/components/schemas/NotificationCenter_EmailSubscriptionItemTypeEnum
        itemIds:
          type: array
          description: >-
            Non-empty array of item IDs. Emails for selected items only will be
            shown
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemId'
    NotificationCenter_EmailSubscriptionItemTypeEnum:
      type: string
      enum:
        - AUDIT
