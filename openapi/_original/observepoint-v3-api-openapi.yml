          $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
        maxMonitoredWebJourneys:
          type: integer
        remainingWebJourneySupportRequests:
          type: integer
    AccountUsageV2_SpecificItemTypeSummary_BaseUsage:
      type: object
      description: >
        Subtypes:

        - AccountUsageV2_SpecificItemTypeSummary_AuditUsage

        - AccountUsageV2_SpecificItemTypeSummary_WebJourneyUsage


        `cumulativeTotal` - number of pages scanned (for audits) or runs
        completed (for web journeys) to date.

        `termLimit`, `cumulativePacing` - can be omitted if there is no limit.

        `overLimitPrice` is only visible to account admins.
      required:
        - itemType
        - cumulativeTotal
      properties:
        itemType:
          $ref: '#/components/schemas/AccountUsageV2_ItemTypeEnum'
        cumulativeTotal:
          $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
        termLimit:
          $ref: '#/components/schemas/AccountUsageV2_TermLimit'
        limitNoteType:
          $ref: '#/components/schemas/AccountUsageV2_LimitNoteTypeEnum'
        cumulativePacing:
          $ref: '#/components/schemas/AccountUsageV2_CumulativePacing'
        overLimitPrice:
          $ref: '#/components/schemas/AccountUsageV2_OverLimitPrice'
      discriminator:
        propertyName: itemType
        mapping:
          AUDIT: >-
            #/components/schemas/AccountUsageV2_SpecificItemTypeSummary_AuditUsage
          WEB_JOURNEY: >-
            #/components/schemas/AccountUsageV2_SpecificItemTypeSummary_WebJourneyUsage
    AccountUsageV2_Trends_ResponseDTO:
      type: object
      description: |
        `termLimit`, `monthlyPacing` - can be omitted if there is no limit
      required:
        - pastPeriods
        - futurePeriods
      properties:
        pastPeriods:
          type: array
          description: Represents all past months
          items:
            $ref: '#/components/schemas/AccountUsageV2_Trends_PastPeriod'
        currentPeriod:
          $ref: '#/components/schemas/AccountUsageV2_Trends_CurrentPeriod'
        futurePeriods:
          type: array
          description: Represents future months, with projected values
          items:
            $ref: '#/components/schemas/AccountUsageV2_Trends_FuturePeriod'
        termLimit:
          $ref: '#/components/schemas/AccountUsageV2_TermLimit'
        limitNoteType:
          $ref: '#/components/schemas/AccountUsageV2_LimitNoteTypeEnum'
        monthlyPacing:
          $ref: '#/components/schemas/AccountUsageV2_MonthlyPacing'
    AccountUsageV2_Trends_PastPeriod:
      allOf:
        - $ref: '#/components/schemas/AccountUsageV2_Trends_BasePeriodTrait'
        - type: object
          description: >
            `periodTotal` and `cumulativeTotal` can represent either pages
            scanned (for audits) or runs completed (for web journeys)
          required:
            - periodTotal
            - cumulativeTotal
          properties:
            periodTotal:
              $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
            cumulativeTotal:
              $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
    AccountUsageV2_Trends_FuturePeriod:
      allOf:
        - $ref: '#/components/schemas/AccountUsageV2_Trends_BasePeriodTrait'
        - type: object
          description: >
            `periodProjectedTotal` and `cumulativeProjectedTotal` can represent
            either pages scanned (for audits) or runs completed (for web
            journeys)
          required:
            - periodProjectedTotal
            - cumulativeProjectedTotal
          properties:
            periodProjectedTotal:
              $ref: '#/components/schemas/AccountUsageV2_FilterableProjectedUsage'
            cumulativeProjectedTotal:
              $ref: '#/components/schemas/AccountUsageV2_FilterableProjectedUsage'
    AccountUsageV2_Trends_CurrentPeriod:
      description: >
        `periodTotal` and `cumulativeTotal` calculated for completed runs in
        current period, `periodProjectedTotal` and `cumulativeProjectedTotal`
        estimated for future runs
      allOf:
        - $ref: '#/components/schemas/AccountUsageV2_Trends_PastPeriod'
        - $ref: '#/components/schemas/AccountUsageV2_Trends_FuturePeriod'
    AccountUsageV2_Trends_BasePeriodTrait:
      type: object
      description: >
        `startDateInclusive` and `endDateExclusive` define period of time for
        which usage is shown
      required:
        - startDateInclusive
        - endDateExclusive
      properties:
        startDateInclusive:
          $ref: '#/components/schemas/DateUtc'
        endDateExclusive:
          $ref: '#/components/schemas/DateUtc'
    AccountUsageV2_DailyTrends_ResponseDTO:
      type: object
      required:
        - dailyUsageItems
      properties:
        dailyUsageItems:
          type: array
          description: >-
            Runs completed per day in the last 3 days, today and scheduled in
            the next 3 days
          items:
            $ref: '#/components/schemas/AccountUsageV2_DailyTrends_Usage'
    AccountUsageV2_DailyTrends_Usage:
      type: object
      description: Scheduled items are shown only for today and dates in the future
      required:
        - day
      properties:
        day:
          $ref: '#/components/schemas/DateUtc'
        noOfCompletedRuns:
          type: integer
        noOfScheduledRuns:
          type: integer
        completedItems:
          type: array
          description: 100 items per day in the account
          maxItems: 100
          items:
            $ref: >-
              #/components/schemas/AccountUsageV2_DailyTrends_ItemInfoWithRunDetails
        scheduledItems:
          type: array
          description: 100 items per day in the account
          maxItems: 100
          items:
            $ref: >-
              #/components/schemas/AccountUsageV2_DailyTrends_ScheduledItemInfoWithRunDetails
        noOfPagesScanned:
          description: used for Audits only
          type: integer
        noOfPagesScheduledToScan:
          description: used for Audits only
          type: integer
    AccountUsageV2_DailyTrends_ItemInfoWithRunDetails:
      allOf:
        - $ref: '#/components/schemas/AccountUsageV2_DailyTrends_ItemInfo'
        - type: object
          properties:
            lastRunId:
              $ref: '#/components/schemas/RunId'
            lastRunCompletedAt:
              $ref: '#/components/schemas/DateAndTime'
            noOfRunsCompleted:
              type: integer
    AccountUsageV2_DailyTrends_ScheduledItemInfoWithRunDetails:
      allOf:
        - $ref: '#/components/schemas/AccountUsageV2_DailyTrends_ItemInfo'
        - type: object
          properties:
            nextScheduledRunDateTime:
              $ref: '#/components/schemas/DateAndTime'
            noOfRunsScheduled:
              type: integer
            noOfPagesScheduledToScan:
              type: integer
    AccountUsageV2_DailyTrends_ItemInfo:
      type: object
      required:
        - frequency
        - itemName
        - itemId
      properties:
        frequency:
          $ref: '#/components/schemas/AccountUsageV2_RunFrequency'
        description:
          description: Schedule description or value of frequency if no schedule is present
          type: string
        itemName:
          description: Audit name or Web Journey name
          type: string
        itemId:
          description: Audit ID or Web Journey ID
          type: integer
    AccountUsageV2_FilterableInteger:
      type: object
      description: |
        `filtered` property can be omitted if filters were not applied
      required:
        - total
      properties:
        total:
          type: integer
        filtered:
          type: integer
    AccountUsageV2_ProjectedUsage:
      type: object
      required:
        - scheduledUsageEstimate
        - historicalUsageEstimate
      properties:
        scheduledUsageEstimate:
          description: Based on scheduled runs
          type: integer
        historicalUsageEstimate:
          description: Based on historical averages
          type: integer
    AccountUsageV2_FilterableProjectedUsage:
      type: object
      description: >-
        Duplicates `AccountUsageV2_ProjectedUsage`, but includes `total` and
        `filtered` values for each estimate
      required:
        - scheduledUsageEstimate
        - historicalUsageEstimate
      properties:
        scheduledUsageEstimate:
          $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
        historicalUsageEstimate:
          $ref: '#/components/schemas/AccountUsageV2_FilterableInteger'
    AccountUsageV2_ItemTypeEnum:
      type: string
      enum:
        - AUDIT
        - WEB_JOURNEY
    AccountUsageV2_TermLimit:
      type: integer
      description: >-
        Limit of pages scanned (for audits) or runs completed (for web journeys)
        for the contract term
    AccountUsageV2_LimitNoteTypeEnum:
      type: string
      enum:
        - UNLIMITED
        - LIMIT_UNDETERMINED
    AccountUsageV2_CumulativePacing:
      type: integer
      description: >-
        Shows how many pages should be scanned to date to hit the limit by the
        end of the contract term
    AccountUsageV2_MonthlyPacing:
      type: integer
      description: >-
        Shows how many pages should be scanned per month to hit the limit by the
        end of the contract term
    AccountUsageV2_OverLimitPrice:
      description: >-
        Price of a page scan (for audits) or a run (for web journeys) over the
        limit
      allOf:
        - $ref: '#/components/schemas/MonetaryAmount'
    AccountUsageV2_AllowOveragesFlag:
      type: boolean
      description: >
        When TRUE, account is allowed to go over the limit and will be charged
        for overages.

        When FALSE, account will be blocked from running audits and web journeys
        that will go over the limit.
    AccountUsageV2_ContractTerm:
      type: object
      description: Contract start and end dates
      required:
        - startDateInclusive
        - endDateInclusive
      properties:
        startDateInclusive:
          $ref: '#/components/schemas/DateUtc'
        endDateInclusive:
          $ref: '#/components/schemas/DateUtc'
    AccountUsageV2_RunFrequency:
      type: string
      description: combination of journey and audit frequency
      enum:
        - paused
        - once
        - 15 minutes
        - 1 hour
        - 6 hours
        - 12 hours
        - daily
        - weekly
        - biweekly
        - monthly
        - quarterly
        - semiannually
        - yearly
        - custom
        - unscheduled
    NotificationCenter_GetEmails_RequestDTO:
      type: object
      description: Filters for searching for emails
