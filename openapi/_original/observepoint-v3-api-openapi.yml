    description: APIs for managing custom HTTP header groups
  - name: rules
    x-displayName: Rules
    description: APIs for managing rules
  - name: schedules
    x-displayName: Schedules
    description: APIs for item schedules and calendars
  - name: email-inboxes
    x-displayName: Email Inboxes
    description: APIs for getting email messages and results from email inboxes
  - name: email-inbox-configuration
    x-displayName: Email Inbox Configuration
    description: APIs for managing email inbox configurations and setting
  - name: email-finder
    x-displayName: Email Finder
    description: OpAdmin-only APIs for finding email inboxes and messages by search string
  - name: web-journeys-internal
    x-displayName: web-journeys-internal
paths:
  /v3/web-audits/{auditId}/runs/{runId}/scores:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - web-audits
      summary: Get scores for specified audit run
      operationId: getAuditRunScores
      responses:
        '200':
          description: Audit scores data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRun_AuditSummary_ScoresDTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/scores</div>
  /v3/web-audits/{auditId}/runs/{runId}/pages:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/AuditRun_PagesList_PageSizeParam'
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AuditRun_PagesSort'
      - $ref: '#/components/parameters/SortDescendingParam'
    get:
      tags:
        - web-audits
      operationId: getAuditRunPages
      summary: Return pages found in the run
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/pages</div>


        Get all the pages in a given audit run
      responses:
        '200':
          description: OK, return a list of unique pages found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRun_Pages_DTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/cookies:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - web-audits
      operationId: getCookies
      summary: Return a list of unique cookies
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/cookies</div>


        Get all unique cookie name and domain found on all the pages in a given
        audit run
      responses:
        '200':
          description: OK, return a list of unique cookies found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CookieDTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-journeys/{webJourneyId}/runs/{runId}/actions/{actionSequenceId}/cookies:
    get:
      tags:
        - web-journey-cookie-report
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-journeys/<span
        class="op-path-parameter">{webJourneyId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/actions/<span
        class="op-path-parameter">{actionSequenceId}</span>/cookies</div>


        Get all cookies affected by the given action
      summary: Get cookies for action
      operationId: getWebJourneyActionCookies
      parameters:
        - $ref: '#/components/parameters/WebJourneyId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ActionSequenceId'
      responses:
        '200':
          description: Cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebJourneyActionCookiesDTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-journeys/{webJourneyId}/runs/{runId}/cookies/origin:
    parameters:
      - $ref: '#/components/parameters/WebJourneyId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags:
        - web-journey-cookie-report
      operationId: getWebJourneyRunCookieOriginStory
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v3/web-journeys/<span
        class="op-path-parameter">{webJourneyId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/cookies/origin</div>


        Get the origin story for a cookie
      summary: Get cookie origin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieOriginRequestDTO'
      responses:
        '200':
          description: OK, return a list of origin story actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebJourneyRunCookieOrigin'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-journeys/{webJourneyId}/runs/{runId}/actions/{actionId}/cookies/origin:
    parameters:
      - $ref: '#/components/parameters/WebJourneyId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/ActionId'
    post:
      tags:
        - web-journey-cookie-report
      operationId: getWebJourneyActionCookieOriginStory
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v3/web-journeys/<span
        class="op-path-parameter">{webJourneyId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/actions/<span
        class="op-path-parameter">{actionId}</span>/cookies/origin</div>


        Get the origin story for a cookie
      summary: Get cookie origin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieOriginRequestDTO'
      responses:
        '200':
          description: OK, return a list of story actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebJourneyResponseCookieOriginDto'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/geo-locations:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - web-audits
      operationId: getGeoLocation
      summary: Return a list of unique geo-locations
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/geo-locations</div>


        Get all unique geo-locations found on all the pages in a given audit run
      responses:
        '200':
          description: OK, return a list of unique geo-locations found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoLocationDTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/request-domains:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - web-audits
      operationId: getRequestDomain
      summary: Return a list of unique request-domains
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/request-domains</div>


        Get all unique request domains found on all the pages in a given audit
        run
      responses:
        '200':
          description: OK, return a list of request-domains found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDomainDTO'
        '400':
          $ref: '#/components/responses/responses-BadRequest'
        '401':
          $ref: '#/components/responses/responses-UnAuthorized'
        '404':
          $ref: '#/components/responses/responses-NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/javascript-variables:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - name: size
        in: query
        required: false
        description: Number of items to be returned at once
        schema:
          type: integer
          maximum: 1000
          default: 50
          minimum: 50
      - name: startAfterPageId
        in: query
        required: false
        description: >
          Offset result, start from pageId next to `startAfterPageId`.

          To fetch first page, don't supply this parameter.

          To fetch subsequent pages, supply `metadata.pagination.lastPageId`
          from previous response
        schema:
          $ref: '#/components/schemas/PageId'
    get:
      tags:
        - web-audits
      operationId: getJavaScriptVariables
      summary: Return a list of pages with JS variables
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/javascript-variables</div>


        Get all JS variables found on all the pages in a given audit run
      responses:
        '200':
          description: Pages with JS variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesWithJsVariablesDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/reports/failures:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - web-audits
      operationId: getAuditFailureResults
      description: >
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/reports/failures</div>


        Returns a summary of failures for the given run.

        Failures summary includes details for Pre-Audit Actions, On-Page
        Actions, all found links excluded and starting URLs navigation results.
      summary: Get run failures summary
      responses:
        '200':
          description: The result of the execution of the Audit Pre-Audit Actions if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFailureResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - API_Key: []
  /v3/internal/audit-run/{runId}/pages:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/AfterParam'
  /v3/web-audits/{auditId}/runs/{runId}/screenshots/thumbnail:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
  /v3/web-journeys/{webJourneyId}/runs/{runId}/screenshots/thumbnail:
    parameters:
      - $ref: '#/components/parameters/WebJourneyId'
      - $ref: '#/components/parameters/RunId'
  /v3/web-audits/{auditId}/runs/{runId}/pages/{pageId}/info:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PageId'
      - name: withLinkSummary
        in: query
        required: false
        description: Parameter to request inclusion of `links` in response
        schema:
          type: boolean
          default: false
      - name: withParentPage
        in: query
        required: false
        description: Parameter to request inclusion of `parent` in response
        schema:
          type: boolean
          default: false
      - name: withScreenshotUrl
        in: query
        required: false
        description: Parameter to request inclusion of `screenshot` in response
        schema:
          type: boolean
          default: false
    get:
      tags:
        - page-details-report
      operationId: getPageInfo
      summary: Return specific page information
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/pages/<span
        class="op-path-parameter">{pageId}</span>/info</div>


        Get page information from specified audit run on a given page
      responses:
        '200':
          description: Page Info by page Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/pages/{pageId}/links/{linkDirection}:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/AuditRun_PageInfo_LinkDirection'
      - $ref: '#/components/parameters/AuditRun_PageInfo_LinkDownloadOptions'
      - $ref: '#/components/parameters/AuditRun_PageInfo_ThisUrlType'
    get:
      tags:
        - page-details-report
      operationId: getPageLinks
      summary: Get page links
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/pages/<span
        class="op-path-parameter">{pageId}</span>/links/<span
        class="op-path-parameter">{linkDirection}</span></div>


        Get up to 1000 page links with specified direction (from/to this page),
        use `downloadPageLinks` to get all items
      responses:
        '200':
          description: Page links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRun_PageInfo_LinksDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/pages/{pageId}/links/{linkDirection}/download:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/AuditRun_PageInfo_LinkDirection'
      - $ref: '#/components/parameters/AuditRun_PageInfo_LinkDownloadOptions'
      - $ref: '#/components/parameters/AuditRun_PageInfo_ThisUrlType'
    get:
      tags:
        - page-details-report
      operationId: downloadPageLinks
      summary: Download page links
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/web-audits/<span
        class="op-path-parameter">{auditId}</span>/runs/<span
        class="op-path-parameter">{runId}</span>/pages/<span
        class="op-path-parameter">{pageId}</span>/links/<span
        class="op-path-parameter">{linkDirection}</span>/download</div>


        Download page links with specified direction (from/to this page)
      responses:
        '200':
          description: Page links
          content:
            text/csv:
              schema:
                type: string
                format: csv
                description: See `AuditRun_PageInfo_LinkItem` for single row schema
          headers:
            content-disposition:
              description: >-
                Controls the name of the downloaded file (in case of `text/csv`
                content)
              schema:
                type: string
                example: >-
                  attachment;
                  filename="page-summary-links-to-this-page-My_Audit-2022-03-22_15-16-17.csv"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - API_Key: []
  /v3/web-audits/{auditId}/runs/{runId}/pages/{pageId}/file-mapping:
    parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PageId'
    get:
      tags:
        - page-details-report
      operationId: getFileMapping
      summary: Return remote file mapping results
