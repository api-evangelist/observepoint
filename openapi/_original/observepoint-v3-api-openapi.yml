        loadTime:
          type: number
        statusCode:
          type: integer
        size:
          type: number
    PageInfo:
      type: object
      properties:
        url:
          type: string
          deprecated: true
          description: Deprecated - use `initialPageUrl` instead
        initialPageUrl:
          type: string
          description: >-
            Initial page URL - before the first redirect. If there were no
            redirects, equal to `finalPageUrl`
        loadTime:
          type: number
        statusCode:
          type: integer
          deprecated: true
          description: Deprecated - use `initialStatusCode` instead
          example: 200
        initialStatusCode:
          type: integer
          description: >-
            Initial page status code - before the first redirect. If there were
            no redirects, equal to `finalStatusCode`
        size:
          type: number
        screenshot:
          type: string
        parent:
          type: object
          properties:
            pageId:
              type: string
            pageUrl:
              type: string
        finalPageUrl:
          type: string
          example: https://example.com/some-path
          description: >-
            Final page URL - after all redirects. If there were no redirects,
            equal to `initialPageUrl`
          maxLength: 11264
        finalStatusCode:
          type: integer
          description: >-
            Final status code - after all redirects. If there were no redirects,
