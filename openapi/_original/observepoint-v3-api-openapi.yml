            not be found. ERR_NAME_NOT_RESOLVED
        visitStartTimestamp:
          type: integer
          format: int64
          description: timestamp - GMT in milliseconds
          example: 1637944293
        visitEndTimestamp:
          type: integer
          format: int64
          description: timestamp - GMT in milliseconds
          example: 1637944293
        redirects:
          type: array
          description: NULL if page had no redirects. Does not include final page
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditRun_PageInfo_RedirectChainElement'
        links:
          $ref: '#/components/schemas/AuditRun_PageInfo_LinkSummary'
        onPageActionResults:
          description: >-
            (Optional) Present if failure/s is/are present in On-Page Actions
            execution
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuditActionResult'
        webVitalsSummary:
          $ref: '#/components/schemas/WebVitalsSummary'
        accessibilityChecksSummary:
          $ref: '#/components/schemas/AccessibilityChecksResults'
    AccessibilityChecksResults:
      type: object
      required:
        - configurationTags
        - issues
      properties:
        configurationTags:
          description: >-
            The tags used for the run configuration that indicate both version
            and conformance level
          type: array
          items:
            type: string
            description: The conformance levels of the checks
          example:
            - wcag2a
            - wcag21aa
            - wcag2aaa
            - wcag2aa
            - wcag21a
            - wcag22aa
        scores:
          $ref: '#/components/schemas/PageAccessibilityScores'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityRuleResult'
        inconclusive:
          description: The accessibility checks that were inconclusive
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityRuleResult'
          example:
            - id: color-contrast
              impact: serious
              description: Elements must meet enhanced color contrast ratio thresholds
              help: Elements must meet enhanced color contrast ratio thresholds
              helpUrl: https://www.w3.org/WAI/WCAG21/Understanding/contrast-enhanced
              htmlElements:
                - html: >-
                    <span class='fl-heading-text'>Validate Your Privacy, Landing
                    Pages, and Analytics</span>
                  htmlCssSelectors:
                    - h1
                    - .fl-heading-text
                  failureSummary: >-
                    Fix any of the following: Element's background color could
                    not be determined due to a background image
    PageAccessibilityScores:
      type: object
      description: >-
        The accessibility scores for the page based on different WCAG versions
        and conformance levels
      required:
        - wcag2a
        - wcag2aa
        - wcag2aaa
        - wcag21a
        - wcag21aa
        - wcag21aaa
        - wcag22a
        - wcag22aa
        - wcag22aaa
      properties:
        wcag2a:
          $ref: '#/components/schemas/PageScoreValue'
        wcag2aa:
          $ref: '#/components/schemas/PageScoreValue'
        wcag2aaa:
          $ref: '#/components/schemas/PageScoreValue'
        wcag21a:
          $ref: '#/components/schemas/PageScoreValue'
        wcag21aa:
          $ref: '#/components/schemas/PageScoreValue'
        wcag21aaa:
          $ref: '#/components/schemas/PageScoreValue'
        wcag22a:
          $ref: '#/components/schemas/PageScoreValue'
        wcag22aa:
          $ref: '#/components/schemas/PageScoreValue'
        wcag22aaa:
          $ref: '#/components/schemas/PageScoreValue'
    PageScoreValue:
      type: number
      format: double
      description: Page accessibility score in %, 1 digit after decimal point
      minimum: 0
      maximum: 100
    AccessibilityRuleResult:
      type: object
      required:
        - id
        - impact
        - description
        - help
        - wcagVersion
        - wcagConformanceLevel
        - successCriteria
        - htmlElements
      properties:
        id:
          type: string
          description: The unique identifier for the evaluated rule
        impact:
          type: string
          description: The impact of the issue
          enum:
            - minor
            - moderate
            - serious
            - critical
        description:
          type: string
          description: The description of the issue
        help:
          type: string
          description: The help text for the issue
          example: Elements must meet enhanced color contrast ratio thresholds
        wcagVersion:
          type: string
          description: The WCAG version that the issue is associated with
          example: '2.1'
        wcagConformanceLevel:
          type: string
          description: The WCAG conformance level that the issue is associated with
          example: AA
        successCriteria:
          description: List of success criteria that the issue is associated with
          type: array
          items:
            $ref: '#/components/schemas/AccessibilitySuccessCriteria'
        htmlElements:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityTestedElement'
          minItems: 1
    AccessibilityTestedElement:
      type: object
      required:
        - html
      properties:
        failureSummary:
          type: string
          description: Summary of all rule criteria which failed and needs to be resolved.
          example: >-
            Fix any of the following: Element has insufficient color contrast of
            6.14 (foreground color: #5d5d5d, background color: #f7f7f7, font
            size: 12.0pt (16px), font weight: normal). Expected contrast ratio
            of 7:1
        fixOneOf:
          type: array
          description: >-
            List of rule criteria where at least one must pass for the rule to
            be considered passing.
          items:
            type: string
        fixAllOf:
          type: array
          description: >-
            List of rule criteria where all must pass for the rule to be
            considered passing.
          items:
            type: string
        doNoneOf:
          type: array
          description: >-
            List of rule criteria where all must not pass for the rule to be
            considered passing.
          items:
            type: string
        html:
          type: string
          description: The html for the node
          example: >-
            <span style='font-weight: 400;'>(without 10 new QA
            headcount.)</span>
        htmlCssSelectors:
          description: The html/css selector for the issue
          type: array
          items:
            type: string
        shadowDomCssSelectors:
          description: >-
            This points to an element in a shadow DOM and each item (except the
            n-1th) in this array is a selector to a DOM element with a shadow
            DOM. The last element in the array points to the final node within
            the shadow DOM.
          type: array
          items:
            type: array
            items:
              type: string
    AccessibilitySuccessCriteria:
      type: object
      required:
        - wcagSuccessCriteria
      properties:
        wcagSuccessCriteria:
          type: string
          description: The WCAG success criteria that the issue is associated with
          example: 1.4.6
        w3Link:
          type: string
          description: The link to the W3 page for the issue
          example: https://www.w3.org/WAI/WCAG21/Understanding/contrast-enhanced
    WebVitalsSummary:
      type: object
      description: Google's Web Vitals metrics for a given page
      required:
        - largestContentfulPaint
        - cumulativeLayoutShift
        - firstContentfulPaint
        - timeToFirstByte
      properties:
        largestContentfulPaint:
          $ref: '#/components/schemas/WebVitalDetails'
        cumulativeLayoutShift:
          $ref: '#/components/schemas/WebVitalDetails'
        firstContentfulPaint:
          $ref: '#/components/schemas/WebVitalDetails'
        timeToFirstByte:
          $ref: '#/components/schemas/WebVitalDetails'
    WebVitalDetails:
      type: object
      description: Specific details for a given Web Vital
      required:
        - pass
        - warnThreshold
        - failThreshold
      properties:
        value:
          type: number
          format: double
          description: The value of the Web Vital.  May also be null.
          example: 1234.56
        pass:
          type: boolean
          description: Whether the Web Vital is beneath the warning threshold
        warnThreshold:
          type: number
          format: double
          description: The threshold for the vital to be in a warning state
          example: 1234
        failThreshold:
          type: number
          format: double
          description: The threshold for the vital to be in a fail state
          example: 1234
    AuditFailureResults:
      type: object
      required:
        - preAuditActionResults
      properties:
        preAuditActionResults:
          $ref: '#/components/schemas/PreAuditActionResults'
        onPagesActionResults:
          $ref: '#/components/schemas/OnPagesActionResults'
        startingUrlResults:
          $ref: '#/components/schemas/StartingUrlResults'
    PreAuditActionResults:
      type: object
      required:
        - zeroAndOut
      properties:
        zeroAndOut:
          description: >-
            Indicates whether pre-audit actions failed executing in all
            allocated engine containers.
          type: boolean
        preAuditActionFailures:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuditActionResult'
          description: >
            Pre-audit action results failures. A a set of failed actions with
            their failure messages.

            Uniqueness is determined by the combination of `failureMessage` and
            `auditActionSnapshotId`.
    OnPagesActionResults:
      description: >-
        (Optional) Present if failure/s is/are present for any Page's On-Page
        Actions execution
      type: object
      required:
        - totalConfiguredCount
        - totalFailedCount
        - resultsSample
      properties:
        totalConfiguredCount:
          type: integer
          description: >-
            Total number of pages configured with On-Page Actions for the Audit
            run
        totalFailedCount:
          type: integer
          description: Total number of Pages in the Audit run with On-Page Action failures
        resultsSample:
          description: A sample of On-Page actions failures.
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/OnPagesActionResultItem'
    OnPagesActionResultItem:
      type: object
      required:
        - pageUrl
        - results
      properties:
        pageUrl:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditActionResult'
    StartingUrlResults:
      type: object
      description: |
        Provide information for the following use cases:
          One and Out - All starting URLs failed to launch
          One and Out - All links found were excluded by filters
      required:
        - failureType
      properties:
        failureType:
          description: |
            Possible types:
              - `no_links_scanned_one_and_out` All conditions must be met:
                1. Number of scanned pages matches number of starting URLs
                2. Scan limit is higher than number of scanned pages
                3. At least 1 link has been excluded.
              - `all_starting_urls_failed_one_and_out` Flag indicating if all starting Urls failed navigation.
                Navigation resulted in status codes:
                 - zero
                 - 403
                 - 500+
                Details for this data is available from the page summary pages endpoint
              - `all_starting_urls_failed_zero_and_out` Flag indicating if all starting Urls failed navigation but without records.
          type: string
          enum:
            - no_links_scanned_one_and_out
            - all_starting_urls_failed_one_and_out
            - all_starting_urls_failed_zero_and_out
        linksExcludedSample:
          description: >
            (Optional) Present if failureType is `no_links_scanned_one_and_out`

            A sample of links found from starting URLs that were excluded from
            the audit.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PageUrl'
        startingUrlFailures:
          description: >-
            (Optional) Present when `all_starting_urls_failed_one_and_out` is
            true
          type: array
          items:
            $ref: '#/components/schemas/StartingUrlFailureItem'
    StartingUrlFailureItem:
      required:
        - statusCode
        - pageCount
      properties:
        statusCode:
          $ref: '#/components/schemas/PageStatusCode'
        pageCount:
          type: integer
        browserError:
          type: string
          description: error produced by browser upon opening the page
          example: >-
            This site can’t be reached. example.com’s server IP address could
            not be found. ERR_NAME_NOT_RESOLVED
    AuditActionResult:
      type: object
      required:
