        path:
          type: string
        expires:
          type: string
        httpOnly:
          type: boolean
        secure:
          type: boolean
        partyType:
          $ref: '#/components/schemas/CookiePartyType'
        sameSite:
          $ref: '#/components/schemas/CookieSameSite'
        partitionKey:
          description: >
            The partition key used for 3rd party cookies using CHIPS

