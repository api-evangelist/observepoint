          type: boolean
          description: >
            if `alertId` is NOT specified, `assignedToAlert` is ignored.

            if `alertId` IS specified `assignedToAlert` has 3 states:

            when TRUE - only items assigned to the specified alert will be
            returned;

            when FALSE - only NOT assigned;

