    AuditRunPage_InitiatorsTree_RequestDTO:
      description: >-
        Request body with filters for Page Details Initiators tree, supporting
        filtering by request tags and cookies as well as request attributes
      type: object
      properties:
        tagsOnly:
          type: boolean
          description: If set then return only tags, else ignored
        primaryTagsOnly:
          type: boolean
          description: If set then return only primary tags, else ignored
        tagId:
          $ref: '#/components/schemas/TagId'
        tagAccount:
          $ref: '#/components/schemas/TagAccount'
        tagVendorId:
          $ref: '#/components/schemas/TagVendorId'
        tagCategoryId:
          $ref: '#/components/schemas/TagCategoryId'
        withCookiesOnly:
          type: boolean
          description: >-
            If set then return only requests that specified cookies, else
            ignored
        cookieName:
          $ref: '#/components/schemas/StringInclusionFilter'
        cookieDomain:
          $ref: '#/components/schemas/StringInclusionFilter'
        partyType:
          $ref: '#/components/schemas/CookiePartyType'
        requestUrl:
          $ref: '#/components/schemas/StringInclusionFilter'
        requestStatusCode:
          $ref: '#/components/schemas/StatusCodeEnum'
    AuditRunPage_InitiatorsTree_ResponseDTO:
      type: object
      required:
        - initiatorsSummary
        - initiatorsTreeRoot
      properties:
        initiatorsSummary:
          $ref: '#/components/schemas/AuditRunPage_InitiatorsSummary'
        initiatorsTreeRoot:
          $ref: '#/components/schemas/InitiatorsTreeVertex'
    AuditRunPage_InitiatorsSummary:
      type: object
      required:
        - totalNetworkRequestCount
        - filteredNetworkRequestCount
        - totalBrokenNetworkRequestCount
        - filteredBrokenNetworkRequestCount
        - totalTagCount
        - filteredTagCount
        - totalCookieCount
        - filteredCookieCount
      properties:
        totalNetworkRequestCount:
          type: integer
          minimum: 1
        filteredNetworkRequestCount:
          type: integer
          minimum: 0
        totalBrokenNetworkRequestCount:
          type: integer
          minimum: 0
        filteredBrokenNetworkRequestCount:
          type: integer
          minimum: 0
        totalTagCount:
          type: integer
          minimum: 0
        filteredTagCount:
          type: integer
          minimum: 0
        totalCookieCount:
          type: integer
          minimum: 0
        filteredCookieCount:
          type: integer
          minimum: 0
    InitiatorsTreeVertex:
      description: >
        Represents a node in the initiators tree.

        Each node/vertex is a network request.

        The root node is the page request.

        The root node does not have `relationToParent`

        Leaf nodes are requests that have no children.

        To get information about specific nodes use `POST
        /v3/web-audits/{auditId}/runs/{runId}/pages/{pageId}/initiators/request-log`
        endpoint with `harEntryIndices` specified
      type: object
      required:
        - harEntryIndex
        - children
        - originalSubtreeSize
        - filteredSubtreeSize
        - matchesFilter
      properties:
        harEntryIndex:
          $ref: '#/components/schemas/HarEntryIndex'
        relationToParent:
          $ref: '#/components/schemas/InitiatorParentChildRelationType'
        children:
          description: >
            When filters applied, only the following nodes are retained in the
            children array:

            - leaf nodes matching filters,

            - intermediate nodes matching filters,

            - intermediate nodes not matching filters but having successors
            matching filters.
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/InitiatorsTreeVertex'
        originalSubtreeSize:
          type: integer
          description: >-
            Total number of nodes under the current node (including its
            children, grand-children and so on)
        filteredSubtreeSize:
          type: integer
          description: >-
            Number of nodes under the current node (including its children,
            grand-children and so on) after filtering
        matchesFilter:
          type: boolean
          description: >-
            True if this node matches the filter criteria; false if kept only as
            a path to matching descendants
    InitiatorParentChildRelationType:
      type: string
      description: |
        Default value is `normal`, may be omitted.
        The root node does not have relation.
      enum:
        - normal
        - weak
    HarEntryIndex:
      type: integer
      minimum: 0
      description: >-
        The 0-based index of the HAR entry that this request corresponds to.
        Used to uniquely identify a request on a page.
    QueryByHarEntryIndices_RequestDto:
      type: object
      required:
        - harEntryIndices
      properties:
        harEntryIndices:
          type: array
          description: Empty array means "query all (no filtering)"
          minItems: 0
          maxItems: 10000
          items:
            $ref: '#/components/schemas/HarEntryIndex'
    GetCookiesByHarEntryIndices_ResponseDto:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/GetCookiesByHarEntryIndices_RequestItem'
    GetCookiesByHarEntryIndices_RequestItem:
      type: object
      required:
        - harEntryIndex
        - cookies
      properties:
        harEntryIndex:
          $ref: '#/components/schemas/HarEntryIndex'
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/GetCookiesByHarEntryIndices_RequestCookieItem'
    GetCookiesByHarEntryIndices_RequestCookieItem:
      allOf:
        - $ref: '#/components/schemas/BaseResponseCookieChangeItemTrait'
    GetRequestsByHarEntryIndices_ResponseDto:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/GetRequestsByHarEntryIndices_RequestItem'
    GetRequestsByHarEntryIndices_RequestItem:
      allOf:
        - $ref: '#/components/schemas/RequestLogTrait'
        - type: object
          description: >
            These properties are available altogether only if request is a tag:

            - tagId

            - tagVendorId

            - tagCategoryId

            - tagAccount

            Property `fileSubstitution` is present only if request had file
            substitution applied.
          required:
            - consoleLogSummary
          properties:
            tagId:
              $ref: '#/components/schemas/TagId'
            tagVendorId:
              $ref: '#/components/schemas/TagVendorId'
            tagCategoryId:
              $ref: '#/components/schemas/TagCategoryId'
            tagAccount:
              $ref: '#/components/schemas/TagAccount'
            consoleLogSummary:
              $ref: '#/components/schemas/ConsoleLogSummary'
            fileSubstitution:
              $ref: '#/components/schemas/FileSubstitution'
    FileSubstitution:
      type: object
      required:
        - substituteUrl
      properties:
        substituteUrl:
          type: string
          description: URL of the file that was used as a substitute
        tagId:
          type: integer
        failure:
          $ref: '#/components/schemas/FileSubstitutionFailure'
    FileSubstitutionFailure:
      type: object
      required:
