        - 3
        - 4
      x-enum-varnames:
        - UNKNOWN
        - FILE_SIZE_LIMIT_EXCEEDED
        - FILE_NOT_FOUND
        - CANNOT_GET_FILE
    HarEntryTimings:
      type: object
