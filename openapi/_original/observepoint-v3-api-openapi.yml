              email:
                type: string
              usage:
                $ref: '#/components/schemas/NotificationCenter_EmailUsage'
    NotificationCenter_EmailUsage:
      type: object
      required:
        - auditCount
        - webJourneyCount
        - ruleCount
        - alertCount
        - emailInboxMessageReceivedCount
        - emailInboxMessageProcessedCount
      properties:
        auditCount:
          type: integer
        webJourneyCount:
          type: integer
        ruleCount:
          type: integer
        alertCount:
          type: integer
          description: Number of alerts excluding usage alerts
        usageAlertCount:
          type: integer
        emailInboxMessageReceivedCount:
          type: integer
        emailInboxMessageProcessedCount:
          type: integer
        scheduledExportCount:
          type: integer
    NotificationCenter_SearchForAssignments_RequestDTO:
      type: object
      description: >-
        Filters for searching for items that may have specific email assigned or
        not assigned
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          description: email to search for
        itemName:
          type: string
          minLength: 1
          description: optional "item name contains substring" filter
        itemLabels:
          type: array
          description: >-
            non-empty array of labels present on an item. When multiple labels
            specified, target item is expected to have all of them (condition
            works as "AND" for all labels specified)
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelId'
        isAssigned:
          type: boolean
          description: >
            - when TRUE - only target items with the specified `email` currently
            assigned will be returned;

            - when FALSE - only target items with the specified `email`
            currently NOT assigned will be returned;

            - when UNDEFINED or NULL - flag is ignored.
    NotificationCenter_SearchForAssignments_ResponseDTO:
      type: object
      required:
        - metadata
        - items
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        items:
          type: array
          items:
            title: NotificationCenter_AssignmentItem
            type: object
            description: >
              `itemLastRunAt` property available only for audits and
              web-journeys.
            required:
              - isAssigned
              - isEditable
              - itemType
              - itemId
              - itemName
            properties:
              isAssigned:
                type: boolean
                description: >-
                  TRUE if specified `email` is assigned to this item, FALSE
                  otherwise
              isEditable:
                type: boolean
                description: >-
                  TRUE if specified `email` can be assigned or unassigned from
                  this item, FALSE otherwise
              itemType:
                $ref: '#/components/schemas/NotificationCenter_AssignmentItemTypeEnum'
              itemId:
                $ref: '#/components/schemas/ItemId'
              itemName:
                type: string
                description: Name of audit/WJ/rule/alert etc
              itemLastRunAt:
                $ref: '#/components/schemas/DateAndTime'
              itemLabels:
                description: may be absent if item does not support labels
                type: array
                minItems: 0
                items:
                  $ref: '#/components/schemas/LabelId'
    NotificationCenter_AssignmentItemTypeEnum:
      type: string
      enum:
        - AUDIT
        - WEB_JOURNEY
        - RULE
        - ALERT
        - USAGE_ALERT
        - EMAIL_INBOX_MESSAGE_RECEIVED
        - EMAIL_INBOX_MESSAGE_PROCESSED
        - SCHEDULED_EXPORT
    NotificationCenter_AssignmentsSortColumn:
      type: string
      enum:
        - IS_ASSIGNED
        - ITEM_NAME
        - RUN_DATE
    ReportFilterValidation_RegexRequestDTO:
      type: object
      required:
        - regex
      properties:
        regex:
          type: string
    ReportFilterValidation_RegexResponseDTO:
      type: object
      required:
        - isValid
        - allUnsupportedSequences
      properties:
        isValid:
          type: boolean
        unsupportedSequence:
          type: string
          description: First unsupported by ObservePoint sequence found in regex
        allUnsupportedSequences:
          type: array
          description: list of all unsupported by ObservePoint regex features/sequences
          items:
            type: string
    TimestampFormatPreview_RequestDTO:
      type: object
      required:
        - format
      properties:
        timestamp:
          type: string
          format: date-time
          description: >
            Optional ISO 8601 timestamp. If not provided, current timestamp will
            be used.

            Example: "2025-12-08T13:39:30.966Z"
        format:
          type: string
          description: Snowflake date-time format string (e.g., "mon dd, yyyy")
          example: mon dd, yyyy
    TimestampFormatPreview_ResponseDTO:
      type: object
      required:
        - timestamp
        - format
        - formattedTimestamp
      properties:
        timestamp:
          type: string
          format: date-time
          description: The timestamp that was formatted
        format:
          type: string
          description: The format string that was applied
        formattedTimestamp:
          type: string
          description: The formatted result
          example: dec 17, 2025
    AuditRun_PageSummary_WebVitals_LargestContentfulPaintFilter:
      description: >-
        Largest Contentful Paint time in milliseconds. Should have `min` and/or
        `max` properties defined. `min` is inclusive and `max` is exclusive.
        `min` should be less than `max`.
      $ref: '#/components/schemas/IntegerRangeFilterTrait'
    AuditRun_PageSummary_WebVitals_FirstContentfulPaintFilter:
      description: >-
        First Contentful Paint time in milliseconds. Should have `min` and/or
        `max` properties defined. `min` is inclusive and `max` is exclusive.
        `min` should be less than `max`.
      $ref: '#/components/schemas/IntegerRangeFilterTrait'
    AuditRun_PageSummary_WebVitals_TimeToFirstByteFilter:
      description: >-
        Time to First Byte time in milliseconds. Should have `min` and/or `max`
        properties defined. `min` is inclusive and `max` is exclusive. `min`
        should be less than `max`.
      $ref: '#/components/schemas/IntegerRangeFilterTrait'
    AuditRun_PageSummary_WebVitals_CumulativeLayoutShiftFilter:
      description: >-
        Cumulative Layout Shift unitless measurement. Should have `min` and/or
        `max` properties defined. `min` is inclusive and `max` is exclusive.
        `min` should be less than `max`.
      $ref: '#/components/schemas/DoubleRangeFilterTrait'
    AuditRun_PageSummary_AggregatedRunWebVitals:
      type: object
      description: Web Vitals aggregated on run level
      required:
        - medianLargestContentfulPaint
        - medianFirstContentfulPaint
        - medianTimeToFirstByte
        - medianCumulativeLayoutShift
        - p75LargestContentfulPaint
        - p75FirstContentfulPaint
        - p75TimeToFirstByte
        - p75CumulativeLayoutShift
      properties:
        medianLargestContentfulPaint:
          type: number
          format: double
          minimum: 0
          description: >-
            median LCP time in milliseconds. This field is deprecated and will
            be removed in the future. Use 75th percentile LCP time instead.
          deprecated: true
        medianFirstContentfulPaint:
          type: number
          format: double
          minimum: 0
          description: >-
            median FCP time in milliseconds. This field is deprecated and will
            be removed in the future. Use 75th percentile FCP time instead.
          deprecated: true
        medianTimeToFirstByte:
          type: number
          format: double
          minimum: 0
          description: >-
            median TTFB time in milliseconds. This field is deprecated and will
            be removed in the future. Use 75th percentile TTFB time instead.
          deprecated: true
        medianCumulativeLayoutShift:
          type: number
          format: double
          minimum: 0
          description: >-
            median unitless measurement of CLS. This field is deprecated and
            will be removed in the future. Use 75th percentile CLS instead.
          deprecated: true
        p75LargestContentfulPaint:
          type: number
          format: double
          minimum: 0
          description: 75th percentile LCP time in milliseconds
        p75FirstContentfulPaint:
          type: number
          format: double
          minimum: 0
          description: 75th percentile FCP time in milliseconds
        p75TimeToFirstByte:
          type: number
          format: double
          minimum: 0
          description: 75th percentile TTFB time in milliseconds
        p75CumulativeLayoutShift:
          type: number
          format: double
          minimum: 0
          description: 75th percentile CLS, unitless measurement.
