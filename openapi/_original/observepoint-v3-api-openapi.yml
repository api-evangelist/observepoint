        - callbackRepositoryName
      properties:
        startingUrls:
          nullable: true
          minItems: 0
          type: array
          items:
            type: string
        callbackWorkflowEventType:
          type: string
          description: >
            The workflow file to be used in for starting the callback workflow

            Has to be a file name without extension, e.g. "audit-complete"
            instead of "audit-complete.yml"
        callbackRepositoryOwner:
          type: string
          description: |
            The owner of the repository where the callback workflow is defined
            This is required to correctly invoke the callback workflow
        callbackRepositoryName:
          type: string
          description: |
            The name of the repository where the callback workflow is defined
            This is required to correctly invoke the callback workflow
        callbackContext:
          type: object
          description: |
            Contains a context for the callback URL to be used in the run
        maxPages:
          type: integer
          nullable: true
          description: >
            Maximum number of pages to scan during the audit run.

            If not provided, will default to the count of starting URLs if it
            exceeds the current audit configuration limit.
        ghAppName:
          description: >
            GitHub App to use for the callback workflow dispatch.

            Defaults to observepoint-integration if not specified (handled in
            service layer).
          allOf:
            - $ref: '#/components/schemas/GhAppNameEnum'
    AuditRun_ConfigurationInfoResponseDTO:
      type: object
      required:
        - blockThirdPartyCookies
        - browserName
        - browserVersion
        - customProxy
        - filters
        - gpcEnabled
        - height
        - loginActions
        - locationId
        - locationName
        - onPageActions
        - privacyConsentActions
        - runDuration
        - scanSpeed
        - startingUrlCount
        - urlsScanned
        - userAgent
        - vpnEnabled
        - width
        - technologyBlockingEnabled
        - fileSubstitutionConfigured
        - discoverSitemaps
        - customHeadersApplied
      properties:
        blockThirdPartyCookies:
          type: boolean
          description: When true the browser blocks all third-party cookies
        browserName:
          type: string
          description: Browser name
        browserVersion:
          type: string
          description: Browser version
        customProxy:
          type: string
          description: The custom proxy used for the audit
        discoverSitemaps:
          type: boolean
          description: >-
            When true, the audit discovers sitemaps on any domains for starting
            URLs and uses those to find URLs to scan
        sitemapData:
          $ref: '#/components/schemas/AuditRun_SitemapData'
        filters:
          type: object
          description: Filters used for the audit to include and exclude urls to be scanned
          required:
            - includeFilters
            - excludeFilters
          properties:
            includeFilters:
              type: array
              items:
                type: string
                format: regex
                example: ^https?://([^/:\?]*\.)?google.com
              description: List of include filters
            excludeFilters:
              type: array
              items:
                type: string
                format: regex
                example: /careers
              description: List of exclude filters
        gpcEnabled:
          type: boolean
          description: GPC enabled or not
        height:
          type: integer
          description: Browser height in pixels
        loginActions:
          type: boolean
          description: Pre-Audit Actions present in configuration or not
        locationId:
          type: integer
          description: Location (Proxy) ID, this maps to a location in the location table
        locationName:
          type: string
          description: >-
            Location  human readable name. This field maps to the db
            location.label
          example: England, London
        onPageActions:
          type: boolean
          description: On Page Actions present in configuration or not
        privacyConsentActions:
          type: boolean
          description: Privacy Consent Actions present in configuration or not
        runDuration:
          type: integer
          description: Run duration in seconds
        scanSpeed:
          type: integer
          description: >
            Scan speed is the number of engines the customer requests to run the
            audit with

            Currently a value between 1-50 is supported, but not guaranteed.
        startingUrlCount:
          type: number
        urlsScanned:
          type: integer
          description: Number of URLs scanned
        userAgent:
          type: string
          description: User agent
        vpnEnabled:
          type: boolean
          description: 'VPN enabled or not for the run configuration '
        width:
          type: integer
          description: Browser width in pixels
        technologyBlockingEnabled:
          type: boolean
          description: Tag ID/Tag Category ID blocking enabled or not
        fileSubstitutionConfigured:
          type: boolean
          description: File Substitution configured or not
        customHeadersApplied:
          type: boolean
          description: Custom HTTP headers applied or not
        auditStoppedByUserId:
          type: integer
          format: int64
          description: ID of the user who stopped the audit run early, if applicable
          nullable: true
    AuditRun_SitemapData:
