    WebJourneyDTO:
      type: object
      description: Web journey configuration and metadata
      required:
        - id
        - name
        - domainId
        - userId
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the web journey
          example: 12345
        name:
          type: string
          description: Name of the web journey
          example: E-commerce Checkout Flow
          maxLength: 255
        notes:
          type: string
          description: Optional notes or description
          example: Tests the complete checkout process
          nullable: true
        domainId:
          type: integer
          description: ID of the associated domain
          example: 123
        userId:
          type: integer
          description: ID of the user who created this web journey
          example: 456
        folderId:
          type: integer
          description: ID of the folder containing this web journey
          example: 789
          nullable: true
        browserWidth:
          type: integer
          description: Browser viewport width in pixels
          example: 1920
          minimum: 250
          maximum: 10000
          nullable: true
        browserHeight:
          type: integer
          description: Browser viewport height in pixels
          example: 1080
          minimum: 250
          maximum: 10000
          nullable: true
        loadVideos:
          type: boolean
          description: Whether to load video content
          example: true
          nullable: true
        vpnEnabled:
          type: boolean
          description: Whether VPN is enabled for this journey
          example: false
          nullable: true
        gpcEnabled:
          type: boolean
          description: Whether Global Privacy Control is enabled
          example: true
          nullable: true
        blockThirdPartyCookies:
          type: boolean
          description: Whether to block third-party cookies
          example: false
          nullable: true
        frequency:
          $ref: '#/components/schemas/WebJourneyFrequencyEnum'
        location:
          type: string
          description: Geographic location for the web journey execution
          example: US-West
          nullable: true
        userAgent:
          type: string
          description: User agent string to use
          example: Chrome/91.0.4472.124
          nullable: true
        userAgentDescription:
          type: string
          description: Human-readable description of the user agent
          example: Chrome Browser
          nullable: true
        customProxy:
          type: string
          description: Custom proxy server configuration
          example: proxy.example.com:8080
          nullable: true
        monitoredByScriptServices:
          type: boolean
          description: Whether this journey is monitored by script services
          example: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the web journey was created
          example: '2023-06-01T10:30:00Z'
        nextCheck:
          type: string
          format: date-time
          description: When the next execution is scheduled
          example: '2023-06-02T10:30:00Z'
          nullable: true
        schedule:
          $ref: '#/components/schemas/Schedule'
          nullable: true
    WebJourneyUpdateDTO:
      type: object
      description: Web journey data for creation or update
      required:
        - domainId
      properties:
        name:
          type: string
          description: Name of the web journey
          example: E-commerce Checkout Flow
          maxLength: 255
        notes:
          type: string
          description: Optional notes or description
          example: Tests the complete checkout process
          nullable: true
        domainId:
          type: integer
          description: ID of the associated domain
          example: 123
        userId:
          type: integer
          description: ID of the user who created this web journey
          example: 456
        folderId:
          type: integer
          description: ID of the folder containing this web journey
          example: 789
          nullable: true
        browserWidth:
          type: integer
          description: Browser viewport width in pixels
          example: 1920
          minimum: 250
          maximum: 10000
          nullable: true
        browserHeight:
          type: integer
          description: Browser viewport height in pixels
          example: 1080
          minimum: 250
          maximum: 10000
          nullable: true
        loadVideos:
          type: boolean
          description: Whether to load video content
          example: true
          nullable: true
        vpnEnabled:
          type: boolean
          description: Whether VPN is enabled for this journey
          example: false
          nullable: true
        gpcEnabled:
          type: boolean
          description: Whether Global Privacy Control is enabled
          example: true
          nullable: true
        blockThirdPartyCookies:
          type: boolean
          description: Whether to block third-party cookies
          example: false
          nullable: true
        frequency:
          $ref: '#/components/schemas/WebJourneyFrequencyEnum'
        location:
          type: string
          description: Geographic location for the web journey execution
          example: US-West
          nullable: true
        userAgent:
          type: string
          description: User agent string to use
          example: Chrome/91.0.4472.124
          nullable: true
        userAgentDescription:
          type: string
          description: Human-readable description of the user agent
          example: Chrome Browser
          nullable: true
        customProxy:
          type: string
          description: Custom proxy server configuration
          example: proxy.example.com:8080
          nullable: true
        monitoredByScriptServices:
          type: boolean
          description: Whether this journey is monitored by script services
          example: true
          nullable: true
        nextCheck:
          type: string
          format: date-time
          description: When the next execution is scheduled
          example: '2023-06-02T10:30:00Z'
          nullable: true
        schedule:
          $ref: '#/components/schemas/BaseScheduleForCreation'
          nullable: true
    WebJourneyStatusDTO:
      type: object
      description: Current status of a web journey
      required:
        - status
        - webJourneyRunning
        - queued
      properties:
        status:
          $ref: '#/components/schemas/WebJourneyRunStatusEnum'
        webJourneyRunning:
          type: boolean
          description: Whether the web journey is currently running
          example: false
        lastCheck:
          type: string
          format: date-time
          description: When the web journey was last executed
          example: '2023-06-01T16:45:00Z'
          nullable: true
        queued:
          type: boolean
          description: Whether the web journey is queued for execution
          example: false
        failureType:
          $ref: '#/components/schemas/WebJourneyFailureTypeEnum'
          nullable: true
          description: >-
            The failure type of the last run, present only when status indicates
            failure
    WebJourneyFrequencyEnum:
      type: string
      description: Frequency options for web journey execution
      enum:
        - paused
        - once
        - 15 minutes
        - 1 hour
        - 6 hours
        - 12 hours
        - daily
        - weekly
        - biweekly
        - monthly
      example: daily
    WebJourneyRunStatusEnum:
      type: string
      description: Status of a web journey run
      enum:
        - NotChecked
        - Ok
        - Failure
        - PageFailure
        - ActionFailure
        - RulesFailure
        - ExecutingActions
        - ProcessingRules
        - DataCollectionFailure
      example: Ok
    WebJourneyFailureTypeEnum:
      type: string
      description: Type of failure for a web journey run
      enum:
        - JOURNEY_ACTION_FAIL
        - JOURNEY_COOKIE_COLLECTION_ERROR
        - JOURNEY_DATA_LAYER_COLLECTION_ERROR
        - JOURNEY_HAR_COLLECTION_ERROR
        - JOURNEY_SCREENSHOT_COLLECTION_ERROR
        - JOURNEY_DATA_COLLECTION_ERROR
    WebActionSelectorTypeEnum:
      type: string
      description: Types of web element selectors
      enum:
        - CSS
        - XPath
        - ID
        - Name
        - Class
        - Tag
        - Attribute
      example: CSS
    RemoteFileMapping:
      type: object
      description: Remote file mapping configuration
      required:
        - id
        - name
        - matchType
        - matchValue
        - accountId
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: Simple surrogate key in the database for this RFM config
          example: 123
        name:
          type: string
          maxLength: 255
          description: A user-supplied name to identify this RFM config
          example: Google Analytics Replacement
        fileId:
          type: string
          description: A string GUID used as the uploaded replacement file's "name" in S3
          example: 8c59d02b-6ebc-4893-9391-9be26c6d34cc
          nullable: true
        fileUrl:
          type: string
          maxLength: 5000
          description: >-
            The replacement URL, or else the name of the replacement file before
            it was uploaded
          example: https://example.com/replacement-script.js
          nullable: true
        matchType:
          type: string
          enum:
            - equals
            - regex
          description: Either "regex" or "equals"
          example: equals
        matchValue:
          type: string
          description: >-
            The request URL to be replaced (or the regex that matches URLs to
            replace)
          example: https://www.google-analytics.com/analytics.js
        accountId:
          type: integer
          description: >-
            Foreign key reference to accounts table. The owner of this
            RemoteFileMapping
          example: 343
        createdBy:
          type: integer
          description: Foreign key reference to the users table. Who created this RFM?
          example: 1362
        createdAt:
          type: string
          format: date-time
          description: When this RFM was created
          example: '2024-01-01T10:15:00.000Z'
        updatedBy:
          type: integer
          description: >-
            Foreign key reference to the users table. Who updated this RFM most
            recently?
          example: 1362
        updatedAt:
          type: string
          format: date-time
          description: When this RFM was last updated
          example: '2024-01-02T10:15:00.000Z'
    RemoteFileMappingRequest:
      type: object
      description: Request data for creating or updating remote file mapping
      required:
        - name
        - matchType
        - matchValue
      properties:
        name:
          type: string
          maxLength: 255
          description: A user-supplied name to identify this RFM config
          example: Google Analytics Replacement
        fileId:
          type: string
          description: A string GUID used as the uploaded replacement file's "name" in S3
          example: 8c59d02b-6ebc-4893-9391-9be26c6d34cc
          nullable: true
        fileUrl:
          type: string
          maxLength: 5000
          description: >-
            The replacement URL, or else the name of the replacement file before
            it was uploaded
          example: https://example.com/replacement-script.js
          nullable: true
        matchType:
          type: string
          enum:
            - equals
            - regex
          description: Either "regex" or "equals"
          example: equals
        matchValue:
          type: string
          description: >-
            The request URL to be replaced (or the regex that matches URLs to
            replace)
          example: https://www.google-analytics.com/analytics.js
    FileUploadResponse:
      type: object
      description: Response for file upload operation
      required:
        - fileId
      properties:
        fileId:
          type: string
          description: Unique identifier for the uploaded file
          example: g3c7fa03-e442-c57b-b179-b349ee4ebce4
    GitHubAppInstallationLinkResponse:
      $ref: '#/components/schemas/GitHubAppInstallationDTO'
    GhAppNameEnum:
      type: string
      description: Allowed GitHub App names for installation
      enum:
        - observepoint-integration
        - observepoint-test-app
    GitHubAppInstallationStatusEnum:
      type: string
      description: Installation status values aligned with backend enum
      enum:
        - pending
        - active
        - disabled
    GitHubAppInstallationSortByEnum:
      type: string
      description: Sortable fields for GitHub App installations
      enum:
        - initiated_at
        - completed_at
        - org_name
    GitHubAppInstallationDTO:
      type: object
      description: GitHub App installation record
      required:
        - id
        - createdByUserId
        - initiatedAt
        - status
      properties:
        id:
          type: integer
          format: int32
        createdByUserId:
          $ref: '#/components/schemas/UserId'
        status:
          $ref: '#/components/schemas/GitHubAppInstallationStatusEnum'
        orgName:
          type: string
        initiatedAt:
          $ref: '#/components/schemas/DateAndTime'
        completedAt:
          $ref: '#/components/schemas/DateAndTime'
        updatedAt:
          $ref: '#/components/schemas/DateAndTime'
        lastUsedAt:
          $ref: '#/components/schemas/DateAndTime'
        disabledAt:
          $ref: '#/components/schemas/DateAndTime'
        installationUrl:
          type: string
          format: uri
          description: >-
            GitHub App installation URL (only populated for pending
            installations)
        expiresAt:
          $ref: '#/components/schemas/DateAndTime'
    GitHubAppInstallations_ResponseDTO:
      type: object
      required:
        - installations
      properties:
        installations:
          type: array
          items:
            $ref: '#/components/schemas/GitHubAppInstallationDTO'
    GitHubAppInstallationCompleteRequestDTO:
      type: object
      description: >
        Request to complete a GitHub App installation.

        Must provide exactly one of: redirectSecret (for direct link flow) or
        claimCode (for claim flow).
      properties:
        redirectSecret:
          type: string
          format: uuid
          description: >-
            Secret from OAuth flow redirect (Phase 2A - user with ObservePoint
            account)
        claimCode:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[A-Za-z0-9]{10}$
          description: >-
            10-character alphanumeric claim code (Phase 2B - teammate claims on
            behalf of GH admin)
    GitHubAppInstallationCompleteResponseDTO:
      type: object
      required:
        - installationId
      properties:
        installationId:
          $ref: '#/components/schemas/GitHubAppInstallationRecordId'
      description: Response returned when an installation request is successfully completed
    GitHubAppOAuthInitiateRequestDTO:
      type: object
      required:
        - installationId
        - hasOpAccount
      properties:
        installationId:
          $ref: '#/components/schemas/InstallationId'
        hasOpAccount:
          type: boolean
          description: Whether user has an ObservePoint account
      description: >
        Request to initiate GitHub OAuth flow for a GitHub App installation.

        User decision on whether they have an ObservePoint account determines
        the subsequent flow.
    GitHubAppRedirectResponseDTO:
      type: object
      required:
        - redirectUri
      properties:
        redirectUri:
          type: string
          format: uri
          description: URI to redirect the user to
      description: Common response containing a redirect URI for GitHub App OAuth flows
    WebJourneyRun_ErrorCode:
      type: integer
      description: |
        Error codes:
        - 10: ValidationError
        - 11: MalformedRequest
        - 33: AlreadyRunning
        - 34: UsageLimitExceeded
    WebJourneyBulkRun_RequestDTO:
      type: array
      description: Array of web journey IDs to start
      items:
        $ref: '#/components/schemas/WebJourneyId'
      example:
        - 107239
        - 107240
        - 107241
    WebJourneyBulkRun_ResponseDTO:
      type: object
      description: Response for bulk run request
      properties:
        failures:
          type: array
          description: Journey IDs that encountered failures
          items:
            $ref: '#/components/schemas/WebJourneyId'
      required:
        - failures
      example:
        failures:
          - 107240
          - 107241
    WebJourneyRun_CreatedResponseDTO:
      type: object
      description: Response when a run is successfully created
      properties:
        newRunId:
          type: integer
          format: int64
          description: The ID of the newly created run
      required:
        - newRunId
      example:
        newRunId: 5765432
    WebJourneyRun_RunExistsResponseDTO:
      type: object
      description: Response when a journey is already running
      properties:
        currentRunId:
          type: integer
          format: int64
          description: The ID of the currently running run
        code:
          $ref: '#/components/schemas/WebJourneyRun_ErrorCode'
      required:
        - currentRunId
        - code
      example:
        currentRunId: 5765431
        code: 33
    WebJourneyRun_ErrorResponseDTO:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/WebJourneyRun_ErrorCode'
      required:
        - message
        - code
      example:
        message: An error occurred
        code: 10
  responses:
    BadRequest:
      description: The request cannot be accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnAuthorized:
      description: Your token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Forbidden:
      description: You don't have enough rights to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFound:
      description: The object you are looking is not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    responses-BadRequest:
      description: The request cannot be accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    responses-UnAuthorized:
      description: Your token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    responses-NotFound:
      description: The object you are looking is not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    FailedDependency:
      description: >-
        The method could not be performed on the resource because the requested
        action depended on another action and that action failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    responses-Forbidden:
      description: You don't have enough rights to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    WebJourneyRun_UnAuthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          example:
            message: Unauthorized
  securitySchemes:
    API_Key:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Use the `Authorization` header in your requests with ObservePoint API
        key as header value.


        Example: `Authorization: abc123...def456`
