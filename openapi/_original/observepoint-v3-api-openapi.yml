          RULE_RESULTS_NOT_APPLIED_RULE_PAGE_COUNT: '#/components/schemas/AuditRun_RuleSummary_RequestDTO'
    AlertMetricChangeTypeEnum:
      type: string
      description: >
        Behaviour per type:

        - VALUE_CHANGE: current - previous

        - VALUE_CHANGE_ABS: ABS(current - previous)

        - RELATIVE_VALUE_CHANGE: 100% * (current - previous) / previous

        - RELATIVE_VALUE_CHANGE: ABS(100% * (current - previous) / previous)


        Composite metric change operators shown on ObservePoint UI should be
        defined as described below:

        - `Changes by (∆)` = VALUE_CHANGE_ABS + GREATER_OR_EQUAL(positive
        number)

        - `Increases by (+)` = VALUE_CHANGE + GREATER_OR_EQUAL(positive number)

        - `Decreases by (-)` = VALUE_CHANGE + LESS_OR_EQUAL(negative number)

        - `Any change` = VALUE_CHANGE_ABS (or VALUE_CHANGE) + NOT_EQUAL(0)

        - `Changes by (∆ %)` = RELATIVE_CHANGE_ABS + GREATER_OR_EQUAL(positive
        number)

        - `Increases by (+%)` = RELATIVE_CHANGE + GREATER_OR_EQUAL(positive
        number)

        - `Decreases by (-%)` = RELATIVE_CHANGE + LESS_OR_EQUAL(negative number)
      enum:
        - VALUE_CHANGE
        - VALUE_CHANGE_ABS
        - RELATIVE_VALUE_CHANGE
        - RELATIVE_VALUE_CHANGE_ABS
    AlertMetricValueComparator:
      type: object
      description: >
        Subtypes: - AlertMetricSpecificValueComparator -
        AlertMetricValueInRangeComparator - AlertMetricValueNotInRangeComparator
      required:
        - operator
      properties:
        operator:
          $ref: '#/components/schemas/AlertMetricValueComparisonOperatorEnum'
      discriminator:
        propertyName: operator
        mapping:
          GREATER: '#/components/schemas/AlertMetricSpecificValueComparator'
          GREATER_OR_EQUAL: '#/components/schemas/AlertMetricSpecificValueComparator'
          EQUAL: '#/components/schemas/AlertMetricSpecificValueComparator'
          NOT_EQUAL: '#/components/schemas/AlertMetricSpecificValueComparator'
          LESS_OR_EQUAL: '#/components/schemas/AlertMetricSpecificValueComparator'
          LESS: '#/components/schemas/AlertMetricSpecificValueComparator'
          BETWEEN: '#/components/schemas/AlertMetricValueInRangeComparator'
          NOT_BETWEEN: '#/components/schemas/AlertMetricValueNotInRangeComparator'
    AlertMetricValueComparisonOperatorEnum:
      type: string
      enum:
        - GREATER
        - GREATER_OR_EQUAL
        - EQUAL
        - NOT_EQUAL
        - LESS_OR_EQUAL
        - LESS
        - BETWEEN
        - NOT_BETWEEN
    AlertMetricSpecificValueComparator:
      allOf:
        - $ref: '#/components/schemas/AlertMetricValueComparator'
        - type: object
          required:
            - targetValue
          properties:
            targetValue:
              type: number
              format: float
    AlertMetricValueInRangeComparator:
      allOf:
        - $ref: '#/components/schemas/AlertMetricValueComparator'
        - type: object
          description: Alert is triggered when `actual >= min AND actual < max`
          required:
            - minInclusive
            - maxExclusive
          properties:
            minInclusive:
              type: number
              format: float
            maxExclusive:
              type: number
              format: float
    AlertMetricValueNotInRangeComparator:
      allOf:
        - $ref: '#/components/schemas/AlertMetricValueComparator'
        - type: object
          description: Alert is triggered when `actual < min OR actual >= max`
          required:
            - minExclusive
            - maxInclusive
          properties:
            minExclusive:
              type: number
              format: float
            maxInclusive:
              type: number
              format: float
    AdHocAlertResultsDTO:
      type: object
      required:
        - alerts
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AdHocAlertResultsItem'
    AdHocAlertResultsItem:
      type: object
      required:
        - alert
        - result
      properties:
        alert:
          $ref: '#/components/schemas/AdHocAlertRequestItem'
        result:
          $ref: '#/components/schemas/AdHocAlertResultDetails'
    AdHocAlertResultDetails:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AlertResultStatusEnum'
        actualValue:
          description: Value of the computed metric or its change.
          type: number
          format: double
        currentRunValue:
          description: >-
            Value of computed metric for current run. Present when alert is
            configured on metric change, not on single run metric value
          type: number
          format: double
        previousRunValue:
          description: >-
            Value of computed metric for previous run. Present when alert is
            configured on metric change, not on single run metric value
          type: number
          format: double
        affectedPageCount:
          description: >-
            Number of pages that are affected by triggered alert. Present when
            alert is triggered and metric type supports it
          type: integer
        filteredPageCount:
          description: Total number of pages that were used to compute alert.
          type: integer
    AlertResultStatusEnum:
      type: string
      description: >
        All statuses except `TRIGGERED` and `NOT_TRIGGERED` mean that
        alert/metric could not be computed. Statuses:

        - UNKNOWN_ERROR: data retrieval or alert computation failed

        - RUN_NOT_FOUND: requested run not found

        - NO_VALUE: no data found for requested run (e.g. rules or consent
        categories were not applied)

        - PREVIOUS_RUN_NOT_FOUND: previous run not found for run-over-run metric
        change alert

        - PREVIOUS_RUN_NO_VALUE: no data found for previous run for run-over-run
        metric change alert
      enum:
        - TRIGGERED
        - NOT_TRIGGERED
        - UNKNOWN_ERROR
        - RUN_NOT_FOUND
        - NO_VALUE
        - PREVIOUS_RUN_NOT_FOUND
        - PREVIOUS_RUN_NO_VALUE
    AlertId:
      type: integer
      format: int64
    LabelId:
      type: integer
      format: int64
      description: Label identifier
      example: 223
      minimum: 1
    CreateAlertRequestDTO:
      type: object
      description: >
        Alert is triggered when comparison holds: `actual value`
        &lt;targetValueComparisonOperator&gt; `targetValue`
      required:
        - name
        - metricType
        - targetValueComparator
        - filtersV0
      properties:
        name:
          $ref: '#/components/schemas/AlertName'
        labels:
          type: array
          description: >-
            Passing null instead of this array while updating an entity will
            prevent API from changing associated labels
          items:
            $ref: '#/components/schemas/LabelId'
        metricType:
          $ref: '#/components/schemas/AlertMetricTypeEnum'
        metricChangeType:
          $ref: '#/components/schemas/AlertMetricChangeTypeEnum'
        targetValueComparator:
          $ref: '#/components/schemas/AlertMetricValueComparator'
        filtersV0:
          type: object
          description: >
            Filters to be applied before computing the alert. Exact type depends
            on `metricType`, see mapping in `AlertMetricTypeToFilterMapping`
        emails:
          type: array
          description: >-
            List of email addresses that receive notifications when alert
            triggers. Will be replaced with Notification Profiles
          items:
            $ref: '#/components/schemas/EmailAddress'
        customAlertMessage:
          type: string
        notificationPolicy:
          $ref: '#/components/schemas/AlertNotificationPolicyEnum'
        isDefaultForNewDataSources:
          $ref: '#/components/schemas/AlertIsDefaultForNewDataSources'
        assignments:
          type: array
          description: >
            Passing null instead of this array while updating an alert will
            prevent API from changing its assignments.

            To pass only updates of assignments (additions/removals) for
            existing alert use `PATCH /v3/alerts/{alertId}/target-items`
            endpoint
          items:
            $ref: '#/components/schemas/AlertAssignmentItem'
        skipSendingAlertSharedWithYouEmail:
          type: boolean
          description: >
            When TRUE, "Alert shared with you" email will NOT be sent to newly
            added email addresses.

            When NOT specified or FALSE, it will be sent.
    AlertIsDefaultForNewDataSources:
      type: boolean
      description: >
        Makes this alert selected by default in data-source (audit/WJ) creation
        UI.

        This is a user-specific flag.
    AlertNotificationPolicyEnum:
      type: string
      description: >
        Behaviour per type:

        - WHEN_NEWLY_TRIGGERED: (*default*) send alert when goes from "ok" to
        "triggered" (resets when no longer triggered)

        - ALWAYS_WHEN_TRIGGERED: send alert notification each time it is
        triggered per run
      enum:
        - WHEN_NEWLY_TRIGGERED
        - ALWAYS_WHEN_TRIGGERED
