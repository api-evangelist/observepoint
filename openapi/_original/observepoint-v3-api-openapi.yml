        this endpoint is get all the data sources in the account with their
        labels
      operationId: getDataSources
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: sortBy
          required: false
          schema:
            $ref: '#/components/schemas/DataSourceSortByEnum'
        - $ref: '#/components/parameters/SortDescendingParam'
        - in: query
          name: itemName
          required: false
          schema:
            type: string
          description: filter the items by a given name
        - in: query
          name: labelIds
          required: false
          schema:
            type: array
            items:
              type: integer
          description: filter the items by label ids
        - in: query
          name: itemType
          required: false
          schema:
            $ref: '#/components/schemas/DataSourceItemType'
          description: filter the items by a given item type
        - in: query
          name: withRuns
          required: false
          schema:
            type: boolean
          description: >-
            if true - response will only include data sources that have at least
            one run, if false - only data sources that have no runs. All data
            sources if not set.
        - in: query
          name: withLabels
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            if true - response will include labels for each data source, if
            false - only the data source id. All data sources if not set.
            Disabling labels will improve performance.
        - in: query
          name: withConsentCategories
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            if true - response will include consent categories. Disabling this
            will improve performance.
