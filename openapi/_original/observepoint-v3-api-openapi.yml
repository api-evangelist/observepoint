        - assignedCustomHttpHeaders
      properties:
        assignedCustomHttpHeaders:
          type: array
          items:
            required:
              - groupId
            properties:
              groupId:
                type: integer
                format: int64
              isApplyToAll:
                type: boolean
                description: >-
                  Indicates whether custom header should be applied to all
                  requests. For GET request, indicates that the header is not
                  just assigned to the request but also applied to all requests.
                  For PUT request, it specifies that the header should be
                  updated to apply to all requests, if set to true, header will
                  not be applied to the request.
    DataSourcesTargetItemsSearchRequest:
      type: object
      description: Filters supported by Unified Data Sources Target Items Search.
      properties:
        searchItemType:
          type: string
          enum:
            - ALERT
            - CUSTOM_HEADER
            - EMAIL_INBOX
            - RULE
        searchedItemId:
          type: integer
          format: int64
        assignedToSearchedItem:
          type: boolean
        itemName:
          type: string
          minLength: 1
        itemLabels:
          type: array
          description: >-
            non-empty array of labels present on an item, works as "item has all
            specified labels" filter
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelId'
        folders:
          $ref: '#/components/schemas/FolderDomainFilter'
    DataSourcesTargetItemsSearchResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourcesTargetItem'
    DataSourcesTargetItem:
      type: object
      properties:
        isAssigned:
          type: boolean
        itemType:
          type: string
          enum:
            - AUDIT
            - WEB_JOURNEY
        itemId:
          type: integer
          format: int64
        itemName:
          type: string
        lastRunAt:
          type: string
          format: date-time
          description: The timestamp of the last run for this item
        itemLabels:
          type: array
          items:
            $ref: '#/components/schemas/AssignedLabel'
    DataSourceTargetItemSortByEnum:
      type: string
      default: ITEM_NAME
      enum:
        - ITEM_NAME
        - RUN_DATE
    ArchivedItemType:
      description: Type of archived item.
      type: string
      enum:
        - audit
        - web-journey
    ArchivedItemSortField:
      description: >
        Field to sort archived items by. Values correspond to the columns shown
        on the

        Archived Items page. Defaults to deletedAt (first enum value used by
        SortingPagination).
      type: string
      default: deletedAt
      enum:
        - deletedAt
        - name
        - originalFolderName
        - startingUrl
        - pageLimit
        - stepCount
        - schedule
        - createdAt
        - deletedBy
    ArchivedItem:
      type: object
      description: A single archived (soft-deleted) audit or journey.
      required:
        - id
        - name
        - type
        - schedule
        - createdAt
        - deletedAt
        - deletedBy
      properties:
        id:
          type: integer
          format: int64
          description: The item id (audit id or web journey id).
        name:
          type: string
          description: The item name.
        type:
          $ref: '#/components/schemas/ArchivedItemType'
        originalFolderId:
          type: integer
          format: int64
          nullable: true
          description: >-
            The Folder the item was in when archived. null if that Folder was
            deleted while the item was archived.
        originalFolderName:
          type: string
          nullable: true
          description: The name of the original Folder. null if the Folder was deleted.
        originalSubFolderId:
          type: integer
          format: int64
          nullable: true
          description: >-
            The Sub-folder (a Domain id) the item was in when archived. null if
            deleted.
        originalSubFolderName:
          type: string
          nullable: true
          description: >-
            The name of the original Sub-folder. null if the Sub-folder was
            deleted.
        startingUrl:
          type: string
          nullable: true
          description: >-
            The starting URL. For a journey, the first "Navigate To" action URL.
            null if none is available.
        pageLimit:
          type: integer
          format: int32
          nullable: true
          description: Audits only. The audit page limit. null for journeys.
        stepCount:
          type: integer
          format: int32
          nullable: true
          description: Journeys only. The number of steps/actions. null for audits.
        schedule:
          type: string
          description: >-
            A human-readable schedule display string, shown as-is (for example
            "Every day", "Unscheduled").
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 date-time the item was created. Shown as Date Created.
        deletedAt:
          type: string
          format: date-time
          description: >-
            ISO 8601 date-time the item was archived (soft-deleted). Shown as
            Archived On and the default sort.
        deletedBy:
          type: string
          description: >-
            A display name or email of the user who archived the item. Shown as
            Archived By.
    ArchivedItemsResponse:
      type: object
      description: >
        A page of archived items for the requested type, plus counts.
        `totalCount` is

        scoped to this request (type + search) and drives pagination.
        `auditCount` and

        `webJourneyCount` are account-wide totals of archived items per type,
        ignoring

        `search` and paging, so the UI can render both tab badges from a single
        request.
      required:
        - items
        - totalCount
        - auditCount
        - webJourneyCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedItem'
        totalCount:
          type: integer
          format: int64
          description: >-
            Total number of archived items matching this request (type + search)
            across all pages. Drives pagination.
        auditCount:
          type: integer
          format: int64
          description: >-
            Total archived audits in the account, ignoring search and paging.
            For the Audits tab badge.
        webJourneyCount:
          type: integer
          format: int64
          description: >-
            Total archived web journeys in the account, ignoring search and
            paging. For the Journeys tab badge.
    SiteCensusBaseDTO:
      type: object
      required:
        - name
        - autoPauseAfter
        - notificationEmails
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier for the Site Census.
        accountId:
          type: integer
          format: int64
          description: The account ID associated with the Site Census.
        name:
          type: string
          description: The name of the Site Census.
        autoPauseAfter:
          type: integer
          maximum: 10080
          minimum: 1
          description: The max time the scan will run, in minutes.
        ownerId:
          type: integer
          format: int64
          description: The userId of the user who created the Site Census.
        currentScanStartedAt:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the current scan session started.
        lastScanStoppedAt:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the last scan session stopped.
        notificationEmails:
          type: array
          minItems: 0
          items:
            type: string
            format: email
          description: >-
            Target email addresses for notification when this census auto-pauses
            or runs out of URLs.
        userAgentId:
          type: integer
          default: 122
          description: The user agent ID used for data collection.
        customHttpHeaders:
          type: array
          default: []
          minItems: 0
          items:
            $ref: '#/components/schemas/SiteCensusCustomHttpHeader'
          description: List of custom HTTP header groups assigned to this site census.
    SiteCensusCustomHttpHeader:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: integer
          format: int64
          description: The ID of the custom HTTP header group.
    SiteCensusBehaviorDTO:
      allOf:
        - $ref: '#/components/schemas/SiteCensusBaseDTO'
        - type: object
          required:
            - startingUrls
            - filterPatterns
          properties:
            startingUrls:
              type: array
              minItems: 0
              items:
                type: string
                format: uri
              description: The list of starting URLs for the Site Census.
            filterPatterns:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/SiteCensusFilterPattern'
    SiteCensusFilterPattern:
      type: object
      required:
        - pathPattern
        - fqdn
        - type
      properties:
        pathPattern:
          type: string
          description: The GLOB pattern to match the path of the URL.
        fqdn:
          type: string
          description: The fully qualified domain name (FQDN) to match against the URL.
        type:
          type: string
          enum:
            - PRIORITY
            - IGNORE
          description: Indicates whether matches should be prioritized or ignored.
    SiteCensusCompleteDTO:
      allOf:
        - $ref: '#/components/schemas/SiteCensusBehaviorDTO'
        - type: object
          required:
            - id
            - isArchived
          properties:
            id:
              type: integer
              format: int64
              description: The unique identifier for the Site Census.
            isArchived:
              type: boolean
              readOnly: true
              description: >-
                Indicates whether the Site Census has been archived. True if and
                only if the census has an archived_at timestamp. Archived
                censuses cannot be edited or restarted, but they can be deleted.
                Server-set; ignored on requests.
    SiteCensusResultsSummaryDTO:
      type: object
      required:
        - uniqueUrls
        - visitedUrls
        - urlsToVisit
        - ignoredUrls
        - brokenUrls
        - isRunning
        - isArchived
      properties:
        uniqueUrls:
          type: integer
          minimum: 0
          description: >-
            The number of unique included URLs found. Included is defined as
            URLs that share the same main-domain as any starting URL.
        visitedUrls:
          type: integer
          minimum: 0
          description: >-
            The number of included URLs visited. Included is defined as URLs
            that share the same main-domain as any starting URL.
        urlsToVisit:
          type: integer
          minimum: 0
          description: >-
            The number of included URLs to visit. Included is defined as URLs
            that share the same main-domain as any starting URL.
        ignoredUrls:
          type: integer
          minimum: 0
          description: >-
            The number of URLs matching an IGNORE filter pattern found on
            included pages. Included is defined as URLs that share the same
            main-domain as any starting URL.
        brokenUrls:
          type: integer
          minimum: 0
          description: >-
            The number of included URLs that are broken. Broken is defined as
            URLs that return a non-2xx,3xx status code. Included is defined as
            URLs that share the same main-domain as any starting URL.
        isRunning:
          type: boolean
          description: Indicates whether the Site Census is currently scanning.
        isArchived:
          type: boolean
          description: >-
            Indicates whether the Site Census has been archived. True if and
            only if the census has an archived_at timestamp.
    SiteCensusSummaryDTO:
      allOf:
        - $ref: '#/components/schemas/SiteCensusResultsSummaryDTO'
        - type: object
          required:
            - censusConfig
          properties:
            censusConfig:
              $ref: '#/components/schemas/SiteCensusCompleteDTO'
    SiteCensusSummariesResponseDTO:
      type: object
      required:
        - metadata
        - censuses
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        censuses:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SiteCensusSummaryDTO'
    SiteCensusUrlSegment:
      type: object
      required:
        - segmentType
      properties:
        segmentType:
          type: string
          description: >
            The type of segment in the path. A static segment is a string in the
            path that does not represent a variable.

            A dynamic segment is one that represents a variable in the URL. For
            example, a dynamic segment could be a user ID.
          enum:
            - STATIC
            - DYNAMIC
        staticSegmentValue:
          type: string
          description: >-
            present when segment type is `static`. A static segment is a string
            in the path that does not represent a variable.
        dynamicSegmentType:
          type: string
          description: >-
            present when segment type is `dynamic`. Use this type to make
            rendering decisions when displaying path segments.
          enum:
            - NUMBER
            - DATETIME
            - ALPHA
            - ALPHA_NUMERIC
    SiteCensusBaseUrlPattern:
      type: object
      description: >-
        The ObservePoint proprietary pattern used to classify URLs with similar
        paths based upon dynamic path segments.
      required:
        - fqdn
        - renderedPathPattern
      properties:
        fqdn:
          type: string
          description: The fully qualified domain name (FQDN) of the URL pattern.
        renderedPathPattern:
          type: string
          description: >-
            The rendered path of the URL pattern with the dynamic segment
            character. Not meant for display.
    SiteCensusUrlPattern:
      allOf:
        - $ref: '#/components/schemas/SiteCensusBaseUrlPattern'
        - type: object
          description: >-
            The ObservePoint proprietary pattern used to classify URLs with
            similar paths based upon dynamic path segments.
          required:
            - urlSegments
          properties:
            urlSegments:
              type: array
              minItems: 0
              description: >-
                The list of URL path segments.  Construct a full path pattern by
                appending the segment in order of array index separated by
                forward slashes.
              items:
                $ref: '#/components/schemas/SiteCensusUrlSegment'
    SiteCensusUrlPatternResultsDTO:
      type: object
      required:
        - urlPattern
        - totalUrls
        - urlsToVisit
        - visitedUrls
        - brokenUrls
      properties:
        urlPattern:
          $ref: '#/components/schemas/SiteCensusUrlPattern'
        totalUrls:
          type: integer
          minimum: 0
          description: The total number of URLs within this pattern.
        urlsToVisit:
          type: integer
          minimum: 0
          description: The number of URLs in this pattern that can still be visited.
        visitedUrls:
          type: integer
          minimum: 0
          description: The number of URLs in this pattern that have been visited.
        brokenUrls:
          type: integer
          minimum: 0
          description: >-
            The number of URLs in this pattern that have been visited, but
            returned with 4xx or 5xx status codes.
        latestFound:
          type: string
          format: date-time
          description: >-
            The date and time of the last URL in this pattern that was found in
            ISO 8601 format
    SiteCensusCurrentResultsDTO:
      type: object
      required:
        - metadata
        - paginatedUrlPatternResults
        - resultsSummary
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        paginatedUrlPatternResults:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SiteCensusUrlPatternResultsDTO'
        resultsSummary:
          $ref: '#/components/schemas/SiteCensusResultsSummaryDTO'
    SiteCensusPatternPreviewResponse:
      type: object
      required:
        - censusId
        - totalUrls
        - urls
      properties:
        censusId:
          type: integer
          format: int64
          description: The unique identifier for the Site Census.
        totalUrls:
          type: integer
        urls:
          type: array
          minItems: 0
          items:
            type: string
    SiteCensusResultsSortByEnum:
      type: string
      default: TOTAL_URLS
      enum:
        - TOTAL_URLS
        - URL_PATTERN
        - URLS_TO_VISIT
        - VISITED_URLS
        - BROKEN_URLS
        - LAST_FOUND
    SiteCensusUrlFolderSortByEnum:
      type: string
      default: FOLDER_NAME
      enum:
        - FOLDER_NAME
        - TOTAL_URLS
        - URLS_TO_VISIT
        - VISITED_URLS
        - BROKEN_URLS
        - LAST_FOUND
    SiteCensusUrlFolderResultDTO:
      type: object
      required:
        - folderPath
        - folderName
        - baseDomain
        - host
        - totalUrls
        - urlsToVisit
        - visitedUrls
        - brokenUrls
        - matched
      properties:
        folderPath:
          type: string
          description: The normalized folder path key.
        folderName:
          type: string
          description: The display name of the folder.
        parentFolderPath:
          type: string
          description: >-
            The normalized parent folder path key. Absent only for the root
            folder.
        baseDomain:
          type: string
          description: The URL base domain.
        host:
          type: string
          description: The URL hostname.
        totalUrls:
          type: integer
          minimum: 0
          description: >-
            The number of URLs counted in the folder's subtree (the folder and
            all of its descendants) that are in view for the current scope.
            Never restricted by searchPattern, so a folder reports the same
            value whether it was reached by browsing or by searching.
        visitedUrls:
          type: integer
          minimum: 0
          description: >-
            The number of counted URLs in the folder's subtree that have been
            visited (live: most_recent_status_code != 0; persisted rollup: any
            2xx/3xx/4xx/5xx). Always totalUrls - urlsToVisit.
        urlsToVisit:
          type: integer
          minimum: 0
          description: >-
            The number of counted URLs in the folder's subtree still awaiting a
            visit (live: most_recent_status_code = 0; persisted rollup: the
            unknown-status bucket, which also absorbs missing, 1xx and 6xx+
            codes).
        brokenUrls:
          type: integer
          minimum: 0
          description: >-
            The number of counted URLs in the folder's subtree where
            most_recent_status_code is between 400 and 599.
        latestFound:
          type: string
          format: date-time
          description: >-
            The latest url_found_at timestamp among the counted URLs in the
            folder's subtree.
        matched:
          type: boolean
          description: >-
            True if this folder is a hit counted toward totalCount: its own name
            (or, for a host root, its hostname) contains searchPattern, or it
            directly contains at least one URL whose page name does. Hits are
            the paged rows and the only rows carrying urls/matchedUrlCount.
            False means the folder is present only as tree context - an ancestor
            needed to connect a hit back to the root (or parentFolderPath);
            context rows are extra and do not count toward totalCount. Always
            true when searchPattern is omitted.
        matchedUrlCount:
          type: integer
          minimum: 0
          description: >
            The uncapped number of this folder's DIRECT child URLs in view:
            every in-view direct URL in browse mode, only those whose own page
            name contains searchPattern in search mode. Present exactly when
            `urls` is (matched rows, urlsPerFolder > 0). May exceed the length
            of `urls`, which is capped at urlsPerFolder - page the remainder
            through the folders/urls endpoint.
        urls:
          type: array
          minItems: 0
          description: >
            Up to urlsPerFolder of this folder's direct-child URLs in view (see
            matchedUrlCount for the uncapped total), always in (URL, id) order -
            the folders/urls endpoint's default, so these URLs reappear there in
            the same relative order (that endpoint lists every direct URL,
            unfiltered by this endpoint's view). Present only on matched rows
            when urlsPerFolder > 0; absent on context rows and when previews are
            disabled.
          items:
            $ref: '#/components/schemas/SiteCensusUrlFolderPageDTO'
    SiteCensusUrlFolderPageDTO:
      type: object
      description: >
        One direct-child URL of the folder row it is nested under. In search
        mode its own page name matched searchPattern; in browse mode every
        in-view direct URL qualifies. Carries no folder identity of its own -
        the enclosing folder row is the identity.
      required:
        - urlId
        - url
        - pageName
      properties:
        urlId:
          type: integer
          format: int64
          description: The site_census_urls row id for this URL.
        url:
          type: string
          description: The full page URL (scheme://host/path?query).
        pageName:
          type: string
          description: >-
            The last path segment - the part of the path that searchPattern is
            matched against.
        mostRecentStatusCode:
          type: integer
          nullable: true
          description: Most recent HTTP status observed; null/0 when not yet visited.
        urlFoundAt:
          type: string
          format: date-time
          nullable: true
          description: When the URL was first found, ISO 8601.
    SiteCensusUrlFolderResultsDTO:
      type: object
      required:
        - metadata
        - folders
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        folders:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SiteCensusUrlFolderResultDTO'
    SiteCensusFolderUrlSortByEnum:
      type: string
      default: URL
      enum:
        - URL
        - STATUS_CODE
        - LAST_FOUND
    SiteCensusFolderSummaryDTO:
      type: object
      required:
        - censusId
        - baseDomain
        - host
        - folderPath
        - totalUrls
        - directUrls
        - childFolderCount
        - visitedUrls
        - urlsToVisit
        - brokenUrls
        - includedUrls
        - ignoredUrls
        - finalized
      properties:
        censusId:
          type: integer
          format: int64
        baseDomain:
          type: string
        host:
          type: string
        folderPath:
          type: string
        totalUrls:
          type: integer
          minimum: 0
          description: >-
            Self-inclusive total URLs in this folder and all descendants
            (descendant_page_count).
        directUrls:
          type: integer
          minimum: 0
          description: URLs sitting directly in this folder (not descendants).
        childFolderCount:
          type: integer
          minimum: 0
          description: Number of immediate child folders.
        visitedUrls:
          type: integer
          minimum: 0
          description: Visited URLs in the subtree (success + redirect + broken buckets).
        urlsToVisit:
          type: integer
          minimum: 0
          description: >-
            Not-yet-categorized URLs in the subtree (unknown-status bucket); ~0
            for a finalized census.
        brokenUrls:
          type: integer
          minimum: 0
          description: URLs in the subtree with a 4xx/5xx status.
        includedUrls:
          type: integer
          minimum: 0
          description: Live count of subtree URLs NOT matching any IGNORE pattern.
        ignoredUrls:
          type: integer
          minimum: 0
          description: Live count of subtree URLs matching an IGNORE pattern.
        finalized:
          type: boolean
          description: >-
            True when the folder's precomputed rollup counts have been finalized
            and are trustworthy.
    SiteCensusFolderUrlDTO:
      type: object
      required:
        - urlId
        - url
      properties:
        urlId:
          type: integer
          format: int64
          description: The site_census_urls row id for this URL.
        url:
          type: string
          description: The full page URL (scheme://host/path?query).
        mostRecentStatusCode:
          type: integer
          nullable: true
          description: Most recent HTTP status observed; null/0 when not yet visited.
        urlFoundAt:
          type: string
          format: date-time
          nullable: true
          description: When the URL was first found, ISO 8601.
    SiteCensusFolderUrlsResultsDTO:
      type: object
      required:
        - metadata
        - urls
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        urls:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/SiteCensusFolderUrlDTO'
    SiteCensusSortByEnum:
      type: string
      default: NAME
      enum:
        - NAME
        - UNIQUE_URLS
        - VISITED_URLS
        - URLS_TO_VISIT
        - IGNORED_URLS
        - BROKEN_URLS
        - SCAN_DATE
    SiteCensusSearchParam:
      type: string
      minLength: 1
      description: Parameter to search for site censuses
    FoundSiteCensusesListResponseDTO:
      type: object
      required:
        - metadata
        - items
      properties:
        metadata:
          $ref: '#/components/schemas/CommonIterableResponseMetadata'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FoundSiteCensusDTO'
    FoundSiteCensusDTO:
      type: object
      description: >
        Represents a site census retrieved from a search operation. Site
        censuses can be searched by the following properties:

        - `id`

        - `name`
      required:
        - id
        - name
        - accountId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        accountId:
          type: integer
          format: int64
    EmailFinderSearchParam:
      type: string
      minLength: 1
      description: Parameter to search for email inboxes or messages
    FoundEmailInboxDTO:
      type: object
      description: >
        Represents an email inbox retrieved from a search operation. Email
        inboxes can be searched by the following properties:

        - `id`

        - `name`
      required:
        - id
        - name
        - accountId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        accountId:
          type: integer
          format: int64
        mostRecentMessageId:
          type: integer
          format: int64
          nullable: true
          description: >-
            ID of the most recently received message in this inbox, or null if
            the inbox has no messages
    FoundEmailMessageDTO:
      type: object
      description: >
        Represents a received email message retrieved from a search operation.
        Email messages can be searched by the following properties:

        - `id`

        - `name` (the message subject)
      required:
        - id
        - name
        - accountId
        - inboxId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        accountId:
          type: integer
          format: int64
        inboxId:
          type: integer
          format: int64
    EmailFinderResultsDTO:
      type: object
      required:
        - inboxes
        - messages
      properties:
        inboxes:
          type: array
          items:
            $ref: '#/components/schemas/FoundEmailInboxDTO'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/FoundEmailMessageDTO'
    RequestBlocking:
      type: object
      description: >-
        (Optional) Present if run configuration had TMS blocking enabled and
        request for this entry was blocked.
      required:
        - blockReason
        - urlSignature
      properties:
        blockReason:
          description: The configuration chosen by user. Phase 2 will include url_signature
          type: string
          enum:
            - tag_id
            - tag_category
            - url_signature
        urlSignature:
          type: string
          description: >-
            The singature used to identify requests.  Tag Signatures shall not
            be exposed to customers (blockReason is `tag_id` or `tag_category`).
        tagId:
          description: >-
            (Optional - Present when reason is `tag_id`) Allows FE to get
            Vendor, Category and other info as they do in tag initiators
          type: integer
        tagCategoryId:
          description: (Optional) Present when reason is `tag_category`)
          type: integer
        failureMessage:
          description: >-
            (Optional) Present if the request was meant to be blocked but it was
            not.
          type: string
    Substitution:
      type: object
      required:
        - substituteUrl
      properties:
        substituteUrl:
          type: string
        failure:
          $ref: '#/components/schemas/RemoteFileMappingFailure'
        tagId:
          type: integer
        tagName:
          type: string
    RemoteFileMappingFailure:
      type: object
