          nullable: true
        dns:
          type: number
          minimum: -1
          nullable: true
        connect:
          type: number
          minimum: -1
          nullable: true
        send:
          type: number
          minimum: -1
        wait:
          type: number
          minimum: -1
        receive:
          type: number
