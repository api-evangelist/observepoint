    GridApi_Request_ColumnExpression:
      oneOf:
        - $ref: '#/components/schemas/GridApi_Request_ColumnExpression_ColumnId'
        - $ref: >-
            #/components/schemas/GridApi_Request_ColumnExpression_AggregateFunction
    GridApi_Request_ColumnExpression_ColumnId:
      type: object
      required:
        - columnId
      properties:
        groupBy:
          type: boolean
          description: If true, the column is used for grouping
          default: false
          x-field-extra-annotation: '@JsonInclude(JsonInclude.Include.NON_DEFAULT)'
        columnId:
          $ref: '#/components/schemas/GridApi_ColumnId'
        format:
          x-field-extra-annotation: '@JsonInclude(JsonInclude.Include.NON_DEFAULT)'
          type: string
          maxLength: 256
          description: >
            The format to use for the timestamp column.

            As for now, it is applicable only for timestamp columns,

            and specifying this property for non-timestamp columns will result
            in an error.


            When the `format` is applied to a timestamp column, it effectively
            becomes a string column,

            so it will accept only:

            - `string_*` filters,

            - `count_distinct` aggregation function.


            Format is specified using the following case-insensitive elements:

            - `YYYY`: Four-digit year.

            - `YY`: Two-digit year.

            - `MM`: Two-digit month (01 = January, and so on).

            - `Q`: One-digit quarter of year (1-4).

            - `WY`: Week number of year (1-54).

            - `MON`: Abbreviated month name.

            - `MMMM`: Full month name.

            - `DD`: Two-digit day of month (01 through 31).

            - `DY`: Abbreviated day of week.

            - `HH24`: Two digits for hour (00 through 23). You must not specify
            AM / PM.

            - `HH12`: Two digits for hour (01 through 12). You can specify AM /
            PM.

            - `AM`, `PM`: Ante meridiem (AM) / post meridiem (PM). Use this only
            with HH12 (not with HH24).

            - `MI`: Two digits for minute (00 through 59).

            - `SS`: Two digits for second (00 through 59).

            - `FF[0-9]`: Fractional seconds with precision 0 (seconds) to 9
            (nanoseconds), e.g. FF, FF0, FF3, FF9. Specifying FF is equivalent
            to FF9 (nanoseconds).

            - `TZH:TZM`, `TZHTZM`, `TZH`: Two-digit time zone hour and minute,
            offset from UTC. Zero offset is `Z`, otherwise offset is prefixed by
            +/- for sign.

            - `UUUU`: Four-digit year in ISO format, which are negative for BCE
            years.


            Anything in the format between double quotes or other than the above
            elements is parsed/formatted without being interpreted.


            Example for date `2025-11-14 16:42:55`:

            - `YYYY-MM-DD HH24:MI:SS`: 2025-11-14 16:42:55

            - `mon dd, yyyy @ HH24:MI:SS`: Nov 14, 2025 @ 16:42:55

            - `DD/MM/YYYY`: 14/11/2025

            - `YYYY-MM-DD`: 2025-11-14

            - `"completed on" mon dd, yyyy`: completed on Nov 14, 2025

            - `YYYY/Q`: 2025/4

            - `YYYY"-Q"Q`: 2025-Q4

            - `YYYY/WY`: 2025/46

            - `YYYY "week" WY`: 2025 week 46
    GridApi_Request_ColumnExpression_AggregateFunction:
      type: object
      description: >
        Represents an aggregate function with optional pivot setting applied to
        a column:

        - if `aggregateFunction` and `aggregatedColumn` are specified,
        `pivotValuesColumnId` and `pivotValue` are not specified, then the
        column is used for aggregation only

        - if `aggregateFunction` and `aggregatedColumn` are not specified,
        `pivotValuesColumnId` and `pivotValue` are specified, then the column is
        used for pivot only with default aggregation function (count)

        - if `aggregateFunction` and `aggregatedColumn` are specified,
        `pivotValuesColumnId` and `pivotValue` are also specified, then the
        column is used for pivot with supplied aggregation function
      properties:
        aggregateFunction:
          $ref: '#/components/schemas/GridApi_AggregateFunctionEnum'
        aggregatedColumn:
          $ref: '#/components/schemas/GridApi_Request_ColumnExpression'
        pivotValuesColumnId:
          $ref: '#/components/schemas/GridApi_ColumnId'
        pivotValue:
          $ref: '#/components/schemas/GridApi_PivotValue'
    GridApi_Request_SortByItem:
      type: object
      description: |
        Sorts the result by the specified column index.
        Default sorting order is ascending.
      required:
        - columnIndex
      properties:
        columnIndex:
          type: integer
          description: Index of the column in the `columns` array
          minimum: 0
        sortDesc:
          type: boolean
          description: >-
            If true, the column will be sorted in descending order. Default is
            ascending
          default: false
    GridApi_Request_TotalItem:
      type: object
      required:
        - columnIndex
        - aggregateFunction
      properties:
        columnIndex:
          type: integer
          description: Index of the column in the `columns` array
          minimum: 0
        aggregateFunction:
          $ref: '#/components/schemas/GridApi_AggregateFunctionEnum'
    GridApi_Request_FilterBase:
      allOf:
        - $ref: '#/components/schemas/GridApi_FilterTrait_Negated'
        - type: object
          description: >
            For top level filters (filters specified in request's
            `filters.conditions` array), `filteredColumn` is required,

            except for the `any_column_contains` filter, which targets all
            columns and must NOT specify `filteredColumn`.

            For nested filters (like `itemConditions` in `list_item_matches`
            filter), it's not required.

            `fieldName` can be used for entity reference field filtering in
            combination with `filteredColumn`.
          required:
            - operator
          properties:
            operator:
              $ref: '#/components/schemas/GridApi_FilterOperatorEnum'
            filteredColumn:
              $ref: '#/components/schemas/GridApi_Request_ColumnExpression'
            fieldName:
              $ref: '#/components/schemas/GridApi_EntityReference_FieldTypeEnum'
      discriminator:
        propertyName: operator
        mapping:
          string_contains: '#/components/schemas/GridApi_Requests_Filter_StringContains'
          string_contains_multi: '#/components/schemas/GridApi_Requests_Filter_StringContainsMulti'
          string_regex: '#/components/schemas/GridApi_Requests_Filter_StringRegex'
          integer_in: '#/components/schemas/GridApi_Requests_Filter_IntegerIn'
          integer_list_contains: '#/components/schemas/GridApi_Requests_Filter_IntegerListContains'
          number_between: '#/components/schemas/GridApi_Requests_Filter_NumberBetween'
          date_time_between: '#/components/schemas/GridApi_Requests_Filter_DateTimeBetween'
          date_time_relative: '#/components/schemas/GridApi_Requests_Filter_DateTimeRelative'
          is_present: '#/components/schemas/GridApi_Requests_Filter_IsPresent'
          metric_alert_any: '#/components/schemas/GridApi_Requests_Filter_MetricAlertAny'
          list_item_matches: '#/components/schemas/GridApi_Requests_Filter_ListItemMatches'
          any_column_contains: '#/components/schemas/GridApi_Requests_Filter_AnyColumnContains'
    GridApi_Requests_Filter_StringContains:
      x-discriminator-value: string_contains
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - arg
          properties:
            arg:
              type: string
              maxLength: 1000
              description: '*arg*'
            wildcardStart:
              type: boolean
              description: >-
                If true, the filter will match entities where the value ends
                with the argument ("*argument")
              default: true
            wildcardEnd:
              type: boolean
              description: >-
                If true, the filter will match entities where the value starts
                with the argument ("argument*")
              default: true
    GridApi_Requests_Filter_StringContainsMulti:
      x-discriminator-value: string_contains_multi
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - conditionMatchMode
            - stringContainsFilters
          properties:
            conditionMatchMode:
              $ref: '#/components/schemas/GridApi_ConditionsMatchModeEnum'
            stringContainsFilters:
              type: array
              description: >-
                array of StringContains filters, which has value of 'columnId'
                the same as columnId of the parent object
              minItems: 1
              maxItems: 1000
              items:
                $ref: '#/components/schemas/GridApi_Requests_Filter_StringContains'
    GridApi_Requests_Filter_StringRegex:
      x-discriminator-value: string_regex
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - arg
          properties:
            arg:
              type: string
              maxLength: 1000
              description: regex
    GridApi_Requests_Filter_IntegerIn:
      x-discriminator-value: integer_in
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - args
          properties:
            args:
              type: array
              description: Non-empty array of arguments
              minItems: 1
              maxItems: 1000
              items:
                type: integer
                format: int64
    GridApi_Requests_Filter_IntegerListContains:
      x-discriminator-value: integer_list_contains
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - args
            - mode
          properties:
            args:
              type: array
              description: Non-empty array of arguments
              minItems: 1
              maxItems: 1000
              items:
                type: integer
                format: int64
            mode:
              $ref: '#/components/schemas/GridApi_Filter_IntegerListContainsModeEnum'
    GridApi_Requests_Filter_NumberBetween:
      x-discriminator-value: number_between
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          properties:
            start:
              type: number
              description: Start number format depends on the number column format
            startInclusive:
              type: boolean
            end:
              type: number
              description: Start number format depends on the number column format
            endInclusive:
              type: boolean
    GridApi_Requests_Filter_DateTimeBetween:
      x-discriminator-value: date_time_between
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          properties:
            start:
              $ref: '#/components/schemas/DateAndTime'
            startInclusive:
              type: boolean
