      type: object
      properties:
        negated:
          type: boolean
          description: >-
            If true, the filter will match entities where the value does not
            match
          default: false
    GridApi_Filter_IntegerListContainsModeEnum:
      type: string
      description: >
        Defines how target list should be matched against the filter args:

        - `contains_any` - at least one element from the filter args should be
        in the target list;

        - `contains_all` - all elements from the filter args should be in the
        target list, but the target list can contain more elements;

        - `contains_only` - all elements from the filter args should be in the
        target list, and the target list should NOT contain other elements.
      enum:
        - contains_any
        - contains_all
        - contains_only
    GridApi_Filter_DateTimeRelativeUnitEnum:
      type: string
      description: Specifies the unit of time for the relative date filter.
      enum:
        - minute
        - hour
        - day
        - week
        - month
    GridApi_ConditionsMatchModeEnum:
      type: string
      description: >
        Specifies how to combine results of multiple conditions when determining
        if a row should be included in the result:

        - `all` - all conditions must be met;

        - `any` - at least one condition must be met.

        Default is `all`.
      enum:
        - all
        - any
    GridApi_ResponseRow:
      type: array
      description: >
        Each row represents a single run. The order of values corresponds to the
        order of columns in the `headers`.

        Nested objects are represented as array of fields.
      items:
        type: object
    GridApi_PivotValue:
      type: object
      description: >
        Pivot value used to filter rows during aggregation. The value should be
        passed in the same format

        as received from the Grid API response. Type depends on the
        `pivotValuesColumnId` column type:

        - `entity_reference` (enum): integer (enum ID), e.g., `1`

        - `entity_reference` (non-enum, single field): integer (entity ID),
        e.g., `123`

        - `entity_reference` (non-enum, multiple fields): array matching Grid
        API response format,
          e.g., `["Tag Name", 123]` or `["Schedule Name", "preset_type"]`. Array elements correspond to the
          entity's fields in the same order as returned by the Grid API. For entity references with `id` field,
          only the `id` field is actually used for pivoting, so other fields can have arbitrary values
          (null or empty strings are acceptable).
        - `id`: integer, e.g., `456`

        - `number` (integer subtype): integer, e.g., `42`

        - `number` (decimal subtype): number (exact match, no epsilon
        tolerance), e.g., `3.14`

        - `string`: string (exact match), e.g., `"value"`

        - `timestamp`: string (ISO 8601 format), e.g., `"2025-01-15T10:30:00Z"`
