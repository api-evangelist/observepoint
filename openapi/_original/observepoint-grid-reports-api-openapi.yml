            Filter the results to only include reports whose report type (ui
            type name)

            contains the specified substring (case-insensitive).
        isFavorite:
          type: boolean
          description: |
            When `true`, only favorite reports will be included.
            When `false`, only not favorite reports will be included.
        anyFieldContains:
          type: string
          description: >
            Filters the results to only include reports where any of the
            following fields

            contains the specified substring (case-insensitive):

            - name

            - description

            - labels' names

            - creator's name (first name + last name)

            - report type (ui type name)
