openapi: 3.0.0
info:
  title: Grid reports API by Observepoint
  version: null
  contact:
    name: Observepoint
    url: https://www.observepoint.com/contact-us
  description: >-
    This section documents the API endpoints for using the ObservePoint Grid
    API, which provides access to ObservePoint data in row/column format.
servers:
  - url: https://api.observepoint.com
    description: ObservePoint Production API
security:
  - API_Key: []
paths:
  /v3/reports/grid/{gridEntityType}:
    parameters:
      - name: gridEntityType
        in: path
        required: true
        description: The grid entity type for which you want to query data
        schema:
          $ref: '#/components/schemas/GridApi_GridEntityTypeInPathEnum'
    post:
      operationId: getGridData
      summary: Get Grid Data
      description: >
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v3/reports/grid/<span
        class="op-path-parameter">{gridEntityType}</span></div>


        This is the main endpoint for the Grid API. It lets you request data in
        row/column format for the

        entities that ObservePoint has collected about your website
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridApi_RequestDTO'
      responses:
        '200':
          description: Grid Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridApi_ResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v3/reports/grid/{gridEntityType}/schema:
    parameters:
      - name: gridEntityType
        in: path
        required: true
        description: Grid entity type
        schema:
          $ref: '#/components/schemas/GridApi_GridEntityTypeInPathEnum'
    get:
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/reports/grid/<span
        class="op-path-parameter">{gridEntityType}</span>/schema</div>


        Returns the list of columns that area available for the specified entity
        type, along with each column's ID, type, supported filter operators, and
        supported aggreate functions
      operationId: getGridSchema
      summary: Get Grid Schema
      responses:
        '200':
          description: Grid Schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridApi_GetSchemaResponseDTO'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v3/reports/grid/saved:
    post:
      operationId: createSavedReport
      summary: Create Saved Report
      description: >-
        A saved report contains information about the report, such as its name
        and permissions, and also the Grid API query definition that is applied
        when users view the report. The query definition uses the same JSON
        format as a [Grid API request](#operation/getGridData)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridApi_CreateSavedReportRequestDTO'
      responses:
        '201':
          description: Saved report created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridApi_CreateSavedReportResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: getSavedReportsList
      summary: List Saved Reports
      parameters:
        - $ref: '#/components/parameters/GridAPI_SavedReports_NameParam'
        - $ref: '#/components/parameters/GridAPI_SavedReports_IsFavoriteParam'
        - $ref: >-
            #/components/parameters/GridAPI_SavedReports_IsOwnedByCurrentUserParam
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/GridAPI_SavedReports_PageSizeParam'
        - $ref: '#/components/parameters/GridAPI_SavedReports_SortColumn'
        - $ref: '#/components/parameters/SortDescendingParam'
        - $ref: '#/components/parameters/GridAPI_SavedReports_IsManagedByOPParam'
        - $ref: '#/components/parameters/GridAPI_SavedReports_VisibilityParam'
      responses:
        '200':
          description: List of saved reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridApi_GetSavedReportsListResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/reports/grid/saved</div>
  /v3/reports/grid/saved/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GridApi_SavedReportId'
    get:
      operationId: getSavedReportById
      summary: Get Saved Report
      responses:
        '200':
          description: Saved report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridApi_SavedReportDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: >-
        <div class="op-path-box"><span class="op-http-method-get">GET</span>
        /v3/reports/grid/saved/<span class="op-path-parameter">{id}</span></div>
    put:
      operationId: updateSavedReport
      summary: Update Saved Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridApi_UpdateSavedReportRequestDTO'
      responses:
        '204':
          description: Saved report updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: >-
        <div class="op-path-box"><span class="op-http-method-put">PUT</span>
        /v3/reports/grid/saved/<span class="op-path-parameter">{id}</span></div>
    delete:
      operationId: deleteSavedReport
      summary: Delete Saved Report
      responses:
        '204':
          description: Saved report deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v3/reports/grid/saved/<span
        class="op-path-parameter">{id}</span></div>
  /v3/reports/grid/saved/{id}/favorites:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GridApi_SavedReportId'
    post:
      operationId: addSavedReportToFavorites
      summary: Favorite Saved Report
      description: >-
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v3/reports/grid/saved/<span
        class="op-path-parameter">{id}</span>/favorites</div>


        Mark a saved report as a "favorite" for the user to whom the API key
        belongs
      responses:
        '204':
          description: Saved report added to favorites successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeSavedReportFromFavorites
      summary: Unfavorite Saved Report
      description: >-
        <div class="op-path-box"><span
        class="op-http-method-delete">DELETE</span> /v3/reports/grid/saved/<span
        class="op-path-parameter">{id}</span>/favorites</div>


        Mark a saved report as not a favorite for the user to whom the API key
        belongs
      responses:
        '204':
          description: Saved report removed from favorites successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v3/reports/grid/op-managed/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
  /v3/reports/grid/{gridEntityType}/exports:
    parameters:
      - name: gridEntityType
        in: path
        required: true
        description: grid entity type
        schema:
          $ref: '#/components/schemas/GridApi_GridEntityTypeInPathEnum'
    post:
      operationId: initiateGridDataExport
      summary: Start a grid data export
      description: >
        <div class="op-path-box"><span class="op-http-method-post">POST</span>
        /v3/reports/grid/<span
        class="op-path-parameter">{gridEntityType}</span>/exports</div>


        Use this endpoint to start an export for a Grid request. After calling
        this endpoint, use the `/v3/exports` endpoint to poll the status of

        the export until it's finished. Then, you can download the results with
        the URL given by the `/v3/exports` endpoint.


        [Learn how to use the Grid export API](../sections/grid-api-exports.md)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridApi_ExportRequestDTO'
      responses:
        '200':
          description: Grid export ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridExportResultDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnAuthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    pageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Page number, starts with 0
    SortDescendingParam:
      name: sortDesc
      in: query
      description: Controls sorting order
      required: false
      schema:
        type: boolean
        default: false
    GridAPI_SavedReports_PageSizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 10
        maximum: 1000
        default: 100
      description: Number of items per page
    GridAPI_SavedReports_SortColumn:
      name: sortBy
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/GridApi_SavedReports_SortColumn'
      description: Sort by field
    GridAPI_SavedReports_NameParam:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: >-
        Filter by report name, works as "saved report name contains substring"
        case-insensitive filter
    GridAPI_SavedReports_IsFavoriteParam:
      name: isFavorite
      in: query
      required: false
      schema:
        type: boolean
      description: Filter by favorite status
    GridAPI_SavedReports_IsOwnedByCurrentUserParam:
      name: isOwnedByCurrentUser
      in: query
      required: false
      schema:
        type: boolean
      description: Filter by ownership status
    GridAPI_SavedReports_IsManagedByOPParam:
      name: isManagedByOP
      in: query
      required: false
      schema:
        type: boolean
      description: Filter by managed by ObservePoint
    GridAPI_SavedReports_VisibilityParam:
      name: visibility
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/GridApi_SavedReportVisibilityEnum'
      description: Filter by visibility status
    GridEntityTypeInPathParam:
      name: gridEntityType
      in: path
      required: true
      description: Grid entity type
      schema:
        $ref: '#/components/schemas/GridApi_GridEntityTypeInPathEnum'
  schemas:
    DateAndTime:
      type: string
      format: date-time
      description: >
        Date-time in [RFC3339 profile ISO 8601
        format](https://www.ietf.org/rfc/rfc3339.txt) with

        the following additional restrictions:

        1. An uppercase T must separate the date and time portions.

        2. An uppercase Z must denote that a numeric time zone offset isn't
        present.


        In general, these timestamp requirements are the same in

        [AWS Step Functions - Choice
        Rules](https://docs.aws.amazon.com/step-functions/latest/dg/amazon-states-language-choice-state.html)
      example: '2016-08-18T17:33:00Z'
    CommonIterableResponseMetadata:
      description: Common metadata for iterable
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    AccountId:
      type: integer
      description: ID of an account
      example: 123
    UserId:
      type: integer
      description: ID of a user
    LabelId:
      type: integer
      format: int64
      description: ID of a label
    GridApi_SchemaCapabilitiesEnum:
      type: string
      x-class-extra-annotation: '@AllowUnknownEnumValues'
      enum:
        - query_all_accounts
        - ui_hints
        - data_dictionary
    GridApi_ColumnId:
      type: string
      description: >
        Depends on the Grid type:

        - Audit Runs Grid: one of the `AuditRunsGridColumnEnum` values

        - Web Journey Runs Grid: one of the `WebJourneyRunsGridColumnEnum`
        values

        - Pages Grid: one of the `PagesGridColumnEnum` values

        - Cookies Grid: one of the `CookiesGridColumnEnum` values

        - Tags Grid: one of the `TagsGridColumnEnum` values

        - Tag Variables Grid: one of the `TagVariablesGridColumnEnum` values

        - Links Grid: one of the `LinksGridColumnEnum` values

        - Network Requests Grid: one of the `NetworkRequestsGridColumnEnum`
        values

        - Accessibility Issues Grid: one of the
        `AccessibilityIssuesGridColumnEnum` values

        - Browser Logs Grid: one of the `BrowserLogsGridColumnEnum` values

        - Rules Grid: one of the `RulesGridColumnEnum` values
    GridApi_SavedReportId:
      type: integer
      format: int64
      description: ID of the saved report
    GridApi_OpManagedReportId:
      type: integer
      format: int64
      description: ID of the OpManaged report
    GridApi_SavedReportSearchParam:
      type: string
      description: Parameter to search for saved reports
    GridApi_GetSchemaResponseDTO:
      type: object
      required:
        - columns
      properties:
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GridApi_SchemaColumnDef'
    GridApi_SchemaColumnDef:
      type: object
      required:
        - columnId
        - type
        - name
        - canGroupBy
        - canPivot
        - supportedFilterOperators
        - supportedAggregateFunctions
        - isIncludedByDefault
        - isNullable
      properties:
        columnId:
          $ref: '#/components/schemas/GridApi_ColumnId'
        type:
          $ref: '#/components/schemas/GridApi_ColumnTypeEnum'
        name:
          type: string
          description: Human-readable value for column, to be shown for users
        canGroupBy:
          type: boolean
          default: true
        canPivot:
          type: boolean
          default: false
        supportedFilterOperators:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GridApi_FilterOperatorEnum'
        supportedAggregateFunctions:
          type: array
          minItems: 0
          description: >
            If not empty, then this column can be aggregated by the functions
            listed in this array. Default aggregation

            function is the first one in the list.

            If empty, then this column cannot be aggregated.
          items:
            $ref: '#/components/schemas/GridApi_AggregateFunctionEnum'
        isIncludedByDefault:
          type: boolean
          description: >-
            If true and no columns are specified in the request, this column
            will be included in the response.
          default: false
        isNullable:
          type: boolean
          description: If true, column value can be null or empty string
          default: false
        dataDictionaryColumnOriginType:
          $ref: '#/components/schemas/DataDictionaryColumnOriginTypeEnum'
      discriminator:
        propertyName: type
        mapping:
          id: '#/components/schemas/GridApi_SchemaColumnDef_Simple'
          entity_reference: '#/components/schemas/GridApi_SchemaColumnDef_EntityReference'
          string: '#/components/schemas/GridApi_SchemaColumnDef_Simple'
          number: '#/components/schemas/GridApi_SchemaColumnDef_Number'
          timestamp: '#/components/schemas/GridApi_SchemaColumnDef_Timestamp'
          image: '#/components/schemas/GridApi_SchemaColumnDef_Image'
    DataDictionaryColumnOriginTypeEnum:
      type: string
      enum:
        - definition_config
        - op_field
        - custom_field
    GridApi_ColumnTypeEnum:
      type: string
      enum:
        - id
        - entity_reference
        - string
        - number
        - timestamp
        - image
    GridApi_SchemaUiHints_FieldUiName:
      type: object
      required:
        - fieldName
        - uiName
      properties:
        fieldName:
          $ref: '#/components/schemas/GridApi_EntityReference_FieldTypeEnum'
        uiName:
          type: string
          description: Human-readable name of the field, e.g. 'Cookie Name'
    GridApi_UiHintsSectionId:
      type: string
      description: Id of the group of columns in which this column should be shown
    GridApi_SchemaSectionUiHints:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/GridApi_UiHintsSectionId'
        name:
          type: string
          description: Name of the group of columns in which this column should be shown
        description:
          type: string
          description: Description of the section, to be shown for users
    GridApi_ColoringRule:
      description: >
        Ordered list of coloring rules to apply to the column. The first
        (left-most) rule with matching threshold wins,

        and its color should be applied to the column value.
      type: object
      required:
        - id
        - thresholds
      properties:
        id:
          $ref: '#/components/schemas/GridApi_ColoringRuleId'
        thresholds:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/GridApi_ColoringRuleThreshold'
    GridApi_ColoringRuleId:
      type: string
      description: ID of the coloring rule
      example: status_code
    GridApi_ColoringRuleThreshold:
      type: object
      required:
        - minValue
        - colorType
      properties:
        minValue:
          type: number
          description: >
            The minimum value for which the rule should be applied -

            if the column value is greater than or equal to the `minValue`, the
            coloring rule should be applied.
        colorType:
          $ref: '#/components/schemas/GridApi_ColorTypeEnum'
    GridApi_ColorTypeEnum:
      type: string
      description: >
        This enum is used to specify the color of the column value in the grid.
        Meanings of the values:

        * default – no special coloration (text is black or white depending on
        the UI theme)

        * excellent – green with glow (best state)

        * good – healthy green (best/healthy state)

        * debug (development or diagnostic information)

        * notice (informational message)

        * info – informational blue color

        * moderate – yellow (middle-ground)

        * warning – orange (issues are becoming concerning)

        * bad – red (worst/critical state)
      enum:
        - excellent
        - default
        - good
        - debug
        - notice
        - info
        - moderate
        - warning
        - bad
    GridApi_LinkBase:
      type: object
      required:
        - text
        - linkType
      properties:
        text:
          type: string
          description: Text of the link/button that will be displayed in the context menu
          example: Show in Pages report
        linkType:
          $ref: '#/components/schemas/GridApi_LinkTypeEnum'
      discriminator:
        propertyName: linkType
        mapping:
          audit_run_report: '#/components/schemas/GridApi_LinkToAuditRunReport'
          page_details: '#/components/schemas/GridApi_LinkToPageDetails'
          web_journey_run_report: '#/components/schemas/GridApi_LinkToWebJourneyRunReport'
          grid_report: '#/components/schemas/GridApi_LinkToGridReport'
          email_inbox: '#/components/schemas/GridApi_LinkToEmailInbox'
          tag_and_variable_rule_modal: '#/components/schemas/GridApi_LinkToTagAndVariableRuleModal'
    GridApi_LinkTypeEnum:
      type: string
      enum:
        - audit_run_report
        - page_details
        - web_journey_run_report
        - grid_report
        - email_inbox
        - tag_and_variable_rule_modal
    GridApi_LinkToAuditRunReport:
      x-discriminator-value: audit_run_report
      allOf:
        - $ref: '#/components/schemas/GridApi_LinkBase'
        - type: object
          required:
            - linkParams
          properties:
            linkParams:
              $ref: '#/components/schemas/GridApi_LinkToAuditRun_LinkParams'
            filters:
              type: object
              description: >-
                report filters object (may be empty), same as in the audit run
                report alert definition.
    GridApi_LinkToAuditRun_LinkParams:
      type: object
      description: >
        This object specifies column IDs which values are used to populate
        variables in audit run report link template.

        Example of link:

        "/audit/{auditId}/run/{auditRunId}/report/{reportType}"
      required:
        - auditIdColumn
        - auditRunIdColumn
        - reportType
      properties:
        auditIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        auditRunIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        reportType:
          $ref: '#/components/schemas/GridApi_LinkToAuditRun_ReportTypeEnum'
    GridApi_LinkToAuditRun_ReportTypeEnum:
      description: >
        This enum is used to specify the type of the audit run report to link
        to, effectively allows FE to determine

        the report link template, examples:

        - "audit_summary" →
        "/audit/{auditId}/run/{auditRunId}/report/audit-summary"

        - "page_summary" →
        "/audit/{auditId}/run/{auditRunId}/report/page-summary"

        and so on.
      type: string
      enum:
        - audit_summary
        - alert_summary
        - page_summary
        - tag_inventory
        - tag_health
        - variable_inventory
        - tag_rules
        - tag_comparisons
        - tag_duplicates_and_multiples
        - cookie_inventory
        - browser_console_logs
        - cookie_privacy
        - tag_privacy
        - request_privacy
        - javascript_file_changes
    GridApi_LinkToPageDetails:
      x-discriminator-value: page_details
      allOf:
        - $ref: '#/components/schemas/GridApi_LinkBase'
        - type: object
          required:
            - linkParams
          properties:
            linkParams:
              $ref: '#/components/schemas/GridApi_LinkToPageDetails_LinkParams'
            filters:
              type: object
              description: >-
                page details filters object (may be empty), same as in the audit
                run report alert definition.
    GridApi_LinkToPageDetails_LinkParams:
      type: object
      description: >
        This object specifies:

        1. column IDs which values are used to populate variables in Page
        Details link template, and

        2. the tab to open in the Page Details report.

        Link template example:

        "/audit/{auditId}/run/{auditRunId}/report/page-details/{pageId}?tab={pageDetailsTab}"
      required:
        - auditIdColumn
        - auditRunIdColumn
        - pageIdColumn
        - pageDetailsTab
      properties:
        auditIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        auditRunIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        pageIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        pageDetailsTab:
          $ref: '#/components/schemas/GridApi_LinkToPageDetails_TabEnum'
    GridApi_LinkToPageDetails_TabEnum:
      type: string
      description: >
        This enum is used to specify the tab to open in the Page Details report,
        FE should map from this enum to

        the `tab` query parameter value of Page Details, examples:

        - "info" → "?tab=page-information"

        - "tags" → "?tab=tags"

        - "tag_initiators" → "?tab=tag-initiators"

        and so on.
      enum:
        - info
        - tags
        - tag_initiators
        - rules
        - cookies
        - accessibility_issues
        - request_log
        - browser_console_logs
    GridApi_LinkToWebJourneyRunReport:
      x-discriminator-value: web_journey_run_report
      allOf:
        - $ref: '#/components/schemas/GridApi_LinkBase'
        - type: object
          required:
            - linkParams
          properties:
            linkParams:
              $ref: '#/components/schemas/GridApi_LinkToWebJourneyRun_LinkParams'
    GridApi_LinkToWebJourneyRun_LinkParams:
      type: object
      description: >
        This object specifies the link to the Web Journey Run report:

        "/web-journey/{webJourneyId}/run/{webJourneyRunId}/results?action={actionSequenceNr}&tab={webJourneyRunReportTab}"


        This object specifies

        1. column IDs which values are used to populate variables in Web Journey
        Run report link template, and

        2. the tab to open in the Web Journey Run report.

        Link template examples:

        -
        "/web-journey/{webJourneyId}/run/{webJourneyRunId}/results?action={actionSequenceNr}&tab={webJourneyRunReportTab}"

        - "/web-journey/{webJourneyId}/run/{webJourneyRunId}/rules"
