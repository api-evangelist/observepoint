      x-discriminator-value: is_present
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
    GridApi_Requests_Filter_MetricAlertAny:
      x-discriminator-value: metric_alert_any
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          properties:
            configured:
              type: boolean
            triggered:
              type: boolean
            subscribed:
              type: boolean
    GridApi_Request_ListFilterModeEnum:
      type: string
      description: >
        Supported modes depend on the `isListOrdered` property of the entity
        reference column

        definition (`GridApi_SchemaColumnDef_EntityReference`):

        - if true, then mode can be `any`, `all`, `first` and `last`;

        - if false, then mode can be either `any` or `all`.
      enum:
        - any
        - all
        - first
        - last
    GridApi_Requests_Filter_ListItemMatches:
      x-discriminator-value: list_item_matches
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - mode
            - itemConditions
          properties:
            mode:
              $ref: '#/components/schemas/GridApi_Request_ListFilterModeEnum'
            itemConditions:
              type: array
              description: >
                Array of filter conditions to apply to list items.

                Note: Double negation is not allowed - if the parent
                list_item_matches filter is negated,

                the itemConditions cannot be negated.
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/GridApi_Request_FilterBase'
            itemConditionMatchMode:
              allOf:
                - $ref: '#/components/schemas/GridApi_ConditionsMatchModeEnum'
                - description: How to combine multiple item conditions (defaults to 'all')
    GridApi_Requests_Filter_AnyColumnContains:
      x-discriminator-value: any_column_contains
      allOf:
        - $ref: '#/components/schemas/GridApi_Request_FilterBase'
        - type: object
          required:
            - arg
          properties:
            arg:
              type: string
              minLength: 1
              maxLength: 1000
              example: Pin
              description: >
                Search text matched case-insensitively as a whole substring (no
                tokenization)

                against every searchable column of the grid:

                - string columns (including dynamic field columns)

                - number columns: matched against their raw stored value as
                plain text
                  (searching `12` matches `12`, `123` and `3.12`); display formatting
                  (percent, units, rounding) is not applied
                - timestamp columns with a supported display format
                (`2026-01-01`,
                  `2026-01-01 13:33:12`, `Jul 22, 2026`, `Jul 22, 2026 | 3:05 PM`): matched
                  against the displayed text, rendered in the user's timezone with English
                  month names (searching `jul` matches July dates); timestamp columns with
                  other display formats are matched against their stored value
                  (`2026-06-25 08:49:27`), also in the user's timezone
                - enum columns: matches the enum's display *label* (not its
                stored ID); for
                  enum lists a row matches when any element's label matches; boolean-valued
                  enums do not participate
                - plain id entity reference columns (e.g. tags, labels): matched
                against the
                  display name of each ID; for lists a row matches when any element's name
                  matches. Only reference types whose full set of names is known up front
                  participate — the global enumerations (locations, countries, user agents),
                  the shared tag catalog (technologies, categories, vendors) and the
                  account's labels; types resolved per id (users, audits, ...) do not
                  participate
                - composed entity reference columns (several fields, e.g. a user
                as id +
                  first name + last name + email): matched through their field columns, so
                  the name and email parts participate as ordinary string columns
                - list entity references without an ID field (e.g. match
                criteria): matched
                  against their JSON text representation, so ids stored inside are not
                  resolved to names

                Excluded: ID and image columns (internal identifiers are not
                user-facing text)

                and columns the caller is not allowed to see (capability-gated
                columns never

                participate).


                Constraints:

                - `filteredColumn` must NOT be set (the operator targets all
                columns)

                - `negated` is not supported

                - blank values (including whitespace-only) are rejected


                Only supported on MySQL-backed grids (currently the Data
                Dictionary grids);

                other grids reject the operator.
    GridApi_Requests_FiltersDTO:
      type: object
      properties:
        conditions:
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GridApi_Request_FilterBase'
        conditionMatchMode:
          $ref: '#/components/schemas/GridApi_ConditionsMatchModeEnum'
    GridApi_RequestDTO:
      type: object
      x-parent: true
      description: >
        Default Grid request body properties.

        Default behaviour:

        - if no page number is specified, default is 0 (the first results page)

        - if no size is specified, default is 100

        - if no filters are specified, default is to return all runs

        Default behaviour for exports:

        - if page and size are not specified, all available rows will be
        exported
      properties:
        size:
          description: how many rows to include in the paginated response
          type: integer
          maximum: 10000
          minimum: 10
        page:
          description: paginated response page number, starts with 0
          type: integer
          minimum: 0
        filters:
          $ref: '#/components/schemas/GridApi_Requests_FiltersDTO'
        columns:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GridApi_Request_ColumnExpression'
        sortBy:
          type: array
          description: >-
            Sorts the result by the specified columns, in the same order as in
            the columns array.
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GridApi_Request_SortByItem'
        totals:
          x-field-extra-annotation: '@JsonInclude(JsonInclude.Include.NON_DEFAULT)'
          type: array
          description: >-
            Dynamic Aggregation Row totals for `columns`. As for now, only one
            aggregation is supported for each column (same `columnIndex`) in the
            `columns` array.
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GridApi_Request_TotalItem'
    GridApi_ExportRequestDTO:
      allOf:
        - $ref: '#/components/schemas/GridApi_RequestDTO'
        - type: object
          properties:
            itemName:
              type: string
            customExportFileName:
              type: string
              description: Override for export file name (without file extension)
            fileFormat:
              $ref: '#/components/schemas/GridExportFileFormatEnum'
    GridExportFileFormatEnum:
      description: |
        Format of the exported file
      type: string
      default: xlsx
      enum:
        - csv
        - tsv
        - xlsx
    GridApi_Response_MetadataHeader:
      x-implements:
        - com.observepoint.reportingapi.gen.interfaces.GridApiMetadataHeader
      description: |
        Represents a single returned column in the grid.
        `column` matches one of columns from the "get grid metadata" response.
      required:
        - column
      properties:
        column:
          $ref: '#/components/schemas/GridApi_Request_ColumnExpression'
        totals:
          x-field-extra-annotation: '@JsonInclude(JsonInclude.Include.NON_DEFAULT)'
          type: array
          description: Totals for the column, available only when requested
          items:
            $ref: '#/components/schemas/GridApi_Response_MetadataHeader_TotalItem'
    GridApi_Response_MetadataHeader_TotalItem:
      type: object
      required:
        - aggregateFunction
        - value
      properties:
        aggregateFunction:
          $ref: '#/components/schemas/GridApi_AggregateFunctionEnum'
        value:
          type: object
          description: >-
            Value of the total, depends on the type of the column and the
            aggregate function
    GridApi_Response_Metadata:
      description: >
        Contains information about the response, such as pagination and returned
        columns/headers.
      allOf:
        - $ref: '#/components/schemas/CommonIterableResponseMetadata'
        - type: object
          required:
            - headers
          properties:
            headers:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/GridApi_Response_MetadataHeader'
    GridApi_ResponseDTO:
      type: object
      required:
        - metadata
        - rows
      properties:
        metadata:
          $ref: '#/components/schemas/GridApi_Response_Metadata'
        rows:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/GridApi_ResponseRow'
    GridExportResultDTO:
      type: object
      required:
        - exportId
      properties:
        exportId:
          $ref: '#/components/schemas/GridExportId'
    GridExportId:
      type: integer
      format: int64
      description: Unique ID of a grid export
    PaginationMetadata:
      type: object
      required:
        - totalCount
        - totalPageCount
        - pageSize
        - currentPageSize
        - currentPageNumber
      properties:
        totalCount:
          description: Total number of items available from all result pages combined
          type: integer
        totalPageCount:
          description: Total number of pages available
          type: integer
        pageSize:
          description: >-
            Page size - number of items per result page configured by `size`
            query parameter or default page size
          type: integer
        currentPageSize:
          description: Number of items in current result page
          type: integer
        currentPageNumber:
          description: Current page number/ordinal
          type: integer
    ErrorModel:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        details:
          type: string
        validationReport:
          type: object
  responses:
    BadRequest:
      description: The request cannot be accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnAuthorized:
      description: Your token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Forbidden:
      description: You don't have enough rights to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFound:
      description: The object you are looking is not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Conflict:
      description: >-
        The request could not be completed due to a conflict with the current
        state of the resource.
    PreconditionFailed:
      description: The request was made under a precondition that is no longer valid.
  securitySchemes:
    API_Key:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Use the `Authorization` header in your requests with ObservePoint API
        key as header value.


        Example: `Authorization: abc123...def456`
