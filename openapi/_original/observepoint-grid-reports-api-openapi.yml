        - webJourneyIdColumn
        - webJourneyRunIdColumn
      properties:
        webJourneyIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        webJourneyRunIdColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        actionSequenceNrColumn:
          $ref: '#/components/schemas/GridApi_ColumnId'
        webJourneyRunReportTab:
          $ref: '#/components/schemas/GridApi_LinkToWebJourneyRun_ReportTabEnum'
    GridApi_LinkToWebJourneyRun_ReportTabEnum:
      type: string
      description: >
        This enum is used to specify the tab to open in the Web Journey Run
        report, FE should map from this enum to

        the `tab` query parameter value of Web Journey Run, examples:

        - "action_details" → "?action={actionSequenceNr}&tab=0"

        - "request_log" → "?action={actionSequenceNr}&tab=0"

        - "tag_presence" → "?action={actionSequenceNr}&tab=1"

        - "variable_summary" → "?action={actionSequenceNr}&tab=2"

        and so on.
      enum:
        - action_details
        - request_log
        - console_log
        - tag_presence
        - variable_summary
        - cookies
        - rules
