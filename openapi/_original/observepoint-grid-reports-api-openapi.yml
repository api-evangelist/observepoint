    GridApi_SchemaUiHints_DisplayUnitEnum:
      type: string
      description: >
        Values returned by the API always have the same unit, but UI can display
        them in different ways. The `displayUnit`

        property controls how the values are displayed in the UI.


        [unit of value returned by API] - [API value example] - [unit of display
        in UI] - [example on UI] correspondence:

        * duration, milliseconds - 3720000                     -
        `duration_human_friendly` - '1 hour 2 min'

        * duration, milliseconds - 372                         -
        `duration_ms`             - '372 ms'

        * duration, milliseconds - 1500                        -
        `duration_sec`            - '1.5 sec'

        * duration, milliseconds - 90000                       -
        `duration_min`            - '1.5 min'

        * decimal number         - 12.3                        -
        `percentage`              - '12.3%'

        * decimal number         - 0.42                        -
        `fraction`                - '0.42'

        * integer number         - 1234                        -
        `size_bytes`              - '1234 bytes'

        * integer number         - 1234                        -
        `size_kb`                 - '1.23 KB'

        * integer number         - 1234567                     -
        `size_mb`                 - '1.23 MB'

        * integer number         - 1234567890                  -
        `size_gb`                 - '1.23 GB'
      enum:
        - count
        - duration_human_friendly
        - duration_ms
        - duration_sec
        - duration_min
        - percentage
        - fraction
        - size_bytes
        - size_kb
        - size_mb
        - size_gb
        - audit_score
        - accessibility_score
    GridApi_AggregateFunctionEnum:
      type: string
      description: >-
        See what aggregate functions are supported for each column in the
        `supportedAggregateFunctions` property of the `GridApi_SchemaColumnDef`
        schema
      enum:
        - avg
        - count_distinct
        - count_rows
        - max
        - median
        - min
        - sum
        - youngest
        - oldest
        - percentile_25
        - percentile_50
        - percentile_75
        - percentile_90
        - percentile_95
        - percentile_99
        - percentile_99_9
        - standard_deviation
        - list_unique_items
    GridApi_SchemaColumnDef_Simple:
      allOf:
        - $ref: '#/components/schemas/GridApi_SchemaColumnDef'
    GridApi_SchemaColumnDef_EntityReference:
      allOf:
        - $ref: '#/components/schemas/GridApi_SchemaColumnDef'
        - type: object
          required:
            - referenceType
            - fields
          properties:
            referenceType:
              $ref: '#/components/schemas/GridApi_EntityReferenceTypeEnum'
            isEnum:
              type: boolean
              default: false
            enumValues:
              type: array
              items:
                $ref: '#/components/schemas/GridApi_EntityReferenceEnumerationItem'
            fields:
              type: array
              description: >
                This array describes which fields (and in which order) are
                included in the response for this entity reference column.

                If entity reference has more than 1 field, then each entity
                reference will be represented as a list of fields' values.

                If entity reference has only 1 field, then each entity reference
                will be represented plain field value.


                Examples:

                1. when `'isList': false, 'fields': [{'fieldName': 'id'},
                {'fieldName': 'name'}]`
                  - then each entity reference will be represented as a list of 2 values: id and name
                  - example: `[1, 'John']`;
                2. when `'isList': true, 'fields': [{'fieldName': 'id'},
                {'fieldName': 'name'}]`
                  - then each entity reference will be represented as a list of lists of 2 values: id and name
                  - example: `[[1, 'John'], [2, 'Jane']]`;
                3. when `'isList': false, 'fields': [{'fieldName': 'id'}]`
                  - then each entity reference will be represented as a single value: id
                  - example: `1`;
                4. when `'isList': true, 'fields': [{'fieldName': 'id'}]`
                  - then each entity reference will be represented as a list of plain values: id
                  - example: `[1, 2]`.
              items:
                $ref: '#/components/schemas/GridApi_EntityReference_FieldItem'
            isList:
              type: boolean
              description: If true, column value contains a list of entity references
              default: false
            isListOrdered:
              type: boolean
              description: >
                Only applicable when `isList` is true. Specifies whether order
                of the elements in the list is significant,

                for instance order of elements in the initiators chain matters,
                or order of elements in the labels list does not matter.


                Affects supported `GridApi_Requests_Filter_ListItemMatches#mode`
                values:

                - when `true` and such a list column supports
                `list_item_matches` filter operator, then this filter
                  supports all 4 `GridApi_Request_ListFilterModeEnum` modes: `any`, `all`, `first` and `last`;
                - when `false` and such a list column supports
                `list_item_matches` filter operator, then this filter
                  supports only `any` and `all` modes.
              default: false
    GridApi_EntityReference_FieldItem:
      type: object
      description: >
        - `fieldName` is the type of the field.

        - `columnId` is the ID of the column associated with the field.

        - `supportedFilterOperators` are the filters supported by the field.
          For example, `list_item_matches` filter allows to specify filtering conditions for the specific fields in the entity reference list,
          and only allows filters mentioned in `supportedFilterOperators`.
        - `referenceType` is the type of the field in terms of entity reference
        classification.
          For example, field with `'fieldName': 'tag_id'` may also have `'referenceType': 'tag_technology_id'`,
          same as tag-related entity reference columns do.

        There are 2 possible cases:

        1. when `'isList': true, then each field will have `fieldName`,
        `supportedFilterOperators`, and optionally `referenceType`
          - example: `[{ 'fieldName': 'name', 'supportedFilterOperators': ['string_contains'] }]`
          - example with `referenceType`: `[{ 'fieldName': 'tag_id', 'supportedFilterOperators': ['integer_in'], 'referenceType': 'tag_technology_id' }]`
        2. when `'isList': false, then each field will have `fieldName` and
        `columnId` (associated column)
          - example: `[{ 'fieldName': 'id', 'columnId': 'AUDIT_ID' }]`
      required:
        - fieldName
      properties:
        fieldName:
          $ref: '#/components/schemas/GridApi_EntityReference_FieldTypeEnum'
        columnId:
          $ref: '#/components/schemas/GridApi_ColumnId'
        supportedFilterOperators:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/GridApi_FilterOperatorEnum'
        referenceType:
          $ref: '#/components/schemas/GridApi_EntityReferenceTypeEnum'
    GridApi_EntityReference_FieldTypeEnum:
      type: string
      description: name of field of the entity reference object
      enum:
