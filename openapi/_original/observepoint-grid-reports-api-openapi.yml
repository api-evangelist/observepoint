              maxItems: 1000
              items:
                $ref: '#/components/schemas/GridApi_Request_ColumnExpression'
            sortBy:
              type: array
              description: >
                Same as in `GridApi_RequestDTO`: sorts the result by the
                specified columns, in the same order as in the columns array
              minItems: 0
              maxItems: 1000
              items:
