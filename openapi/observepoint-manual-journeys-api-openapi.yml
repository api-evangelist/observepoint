        '423':
          description: This item has active run. Please stop & discard active run first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemIsRunningApiError'
      security:
      - API_Key: []
      summary: Delete manual journey via POST request
      tags:
      - Manual Journeys
