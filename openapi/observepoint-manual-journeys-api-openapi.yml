        traversableAgain:
          type: boolean
    Value:
      type: object
    RuleResultOverview:
      type: object
      required:
      - broken
      - failed
      - notApplied
      - passed
      properties:
        broken:
          format: int32
          type: integer
        failed:
          format: int32
          type: integer
        notApplied:
          format: int32
          type: integer
        passed:
          format: int32
          type: integer
    Journey:
      type: object
      required:
      - createdAt
      - emails
      - folderId
      - id
      - name
      - osOfDevice
      - updatedAt
      - userId
      - versionOfOs
      properties:
        createdAt:
          format: date-time
          type: string
        emails:
          items:
            type: string
          type: array
        folderId:
          format: int32
          type: integer
        id:
          format: int32
          type: integer
        journeyType:
          format: int32
          type: integer
        labels:
          items:
            $ref: '#/components/schemas/Label'
          type: array
        name:
          type: string
        osOfDevice:
          type: string
        updatedAt:
          format: date-time
          type: string
        userId:
          format: int32
          type: integer
        versionOfOs:
          type: string
    Authorization:
      type: object
      required:
