        osOfDevice:
          type: string
        proxyInfo:
          type: string
        requestedAt:
          format: date-time
          type: string
        rulesDetails:
          $ref: '#/components/schemas/RunRuleDetails'
        startedAt:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/Value'
        versionOfOs:
          type: string
  requestBodies:
    LabelArray:
      content:
        application/json:
          schema:
            items:
