components:
  schemas:
    Tag:
      type: object
      required:
      - category
      - duplicateScoring
      - icon
      - id
      - name
      properties:
        category:
          $ref: '#/components/schemas/TagCategory'
        duplicateScoring:
          type: boolean
        icon:
          description: Tag icon URI
          type: string
        id:
          format: int32
          type: integer
        name:
          type: string
        numSignatures:
          type: number
        numVariables:
          type: number
        type:
          $ref: '#/components/schemas/TagType'
        vendor:
          $ref: '#/components/schemas/TagVendor'
      description: Tag data
    TagType:
      type: object
    Value:
      type: object
    InitializedJourney:
      type: object
      required:
      - journeyId
      - name
      - proxyInfo
      - runId
      properties:
        certificate:
          $ref: '#/components/schemas/Certificate'
        journeyId:
          format: int32
          type: integer
        name:
          type: string
        proxyInfo:
          $ref: '#/components/schemas/ProxyInfo'
        runId:
          format: int32
          type: integer
    SeqValue:
      type: object
      required:
      - empty
      - traversableAgain
      properties:
        empty:
          type: boolean
