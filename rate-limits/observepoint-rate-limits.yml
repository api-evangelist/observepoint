scope: per-api-key
enforcement_status: 429
note: >-
  ObservePoint publishes a dedicated rate-limiting page. Limits are enforced per API key and vary by
  endpoint; the docs give a band rather than a per-endpoint table. Critically, NO rate-limit response
  headers are documented anywhere (no X-RateLimit-*, no RateLimit-*, no Retry-After), and 429 is not
  declared on a single operation in any of the three published OpenAPI documents — so an agent has no
  runtime signal at all and must discover exhaustion by receiving a bare 429.
