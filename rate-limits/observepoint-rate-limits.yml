exhaustion:
  status: 429
  behaviour: >-
    Wait and retry. "Usually a few seconds will suffice. Sometimes your code will need to retry for up
    to 5 minutes. Your code cannot cause harm by continuing to retry when it receives a 429 response."
  backoff_guidance: retry-with-wait (no published algorithm, no Retry-After header)
  billing: >-
    "You will not be billed if your code gets rate limited." Rate-limited requests do not consume paid usage.
  source: https://api-docs.observepoint.com/sections/rate-limiting
stability:
  note: >-
    "ObservePoint occasionally changes rate limits to ensure the API can operate reliably." The published
    numbers are explicitly non-contractual.
