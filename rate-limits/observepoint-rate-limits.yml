  unit: requests
  source: https://api-docs.observepoint.com/sections/rate-limiting
  quote: >-
    The rate limit varies between API endpoints, but as a general rule, the API will allow between 100
    and 600 requests per minute, with some endpoints allowing 1,000 requests per minute.
- scope: per-api-key
