gaps:
- No RFC 9457 / application/problem+json representation on any operation.
- No 5xx response is declared on any operation in any of the three specs, despite the docs describing 5xx behaviour.
- No 429 response is declared on any operation, despite a dedicated rate-limiting doc page.
- 401 responses declare no response body schema, so the plain-text 401 an agent actually receives is undocumented.
