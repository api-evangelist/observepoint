format: proprietary-json
rfc9457: false
note: >-
  ObservePoint does NOT use RFC 9457 application/problem+json. Errors are ordinary application/json
  objects. Two envelopes are in play: the v3/Grid `ErrorModel` (timestamp, message, details,
  validationReport) and a numeric-code envelope used by v2 and by a few v3 run endpoints
  (errorCode, message, plus endpoint-specific fields such as runId or items). A live unauthenticated
  probe of api.observepoint.com returned the second shape verbatim.
