generated: '2026-08-26'
method: probed
source: live GET probes of /.well-known/* on every ObservePoint host in apis.yml and in the OpenAPI servers[] blocks
note: >-
  ObservePoint serves no /.well-known documents on any host. api.observepoint.com answers every path with
  its normal JSON 404 envelope ({"message":"Requested resource not found","errorCode":0}); www.observepoint.com
  returns the WordPress 404 page (or an nginx 404 for security.txt); api-docs.observepoint.com returns the
  Redocly SPA 404 shell; app.observepoint.com is an S3-backed origin that answers 403 AccessDenied for every
  /.well-known path. No security.txt, no api-catalog, no OAuth/OIDC metadata, no agent card. Because nothing
  returned a real document, NO WellKnown / SecurityTxt / APICatalog pointer is emitted in apis.yml — this file
  records a measured absence, not a served surface.
