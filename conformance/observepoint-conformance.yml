domain_standards:
  market: web governance / digital analytics and privacy assurance
  note: >-
    ObservePoint's market has no interoperability standard of the kind `domain_standard_conformance`
    rewards — there is no SCIM/OData/OpenRTB/HL7/ISO-20022 equivalent for tag auditing, and ObservePoint
    declares none in any of its three contracts. What it DOES do is measure other people's compliance
    regimes: the v3 contract carries first-class privacy and accessibility report surfaces whose subject
    matter is regulatory. Those are recorded below as subject-matter coverage, NOT as conformance claims
    by ObservePoint, and no `domain_standard_conformance` credit should be read from them.
  declared_in_contract: false
  subject_matter_regimes:
  - regime: WCAG (Web Content Accessibility Guidelines)
    surface: Accessibility issue reporting on audit runs
    evidence: >-
      openapi/observepoint-v3-api-openapi.yml — GET /v3/web-audits/{auditId}/runs/{runId}/live-results/
      accessibility-issues and .../accessibility-issues/{requestId}; the product solution page
      https://www.observepoint.com/solutions/accessibility/
    note: ObservePoint scans customer sites for WCAG issues; it does not claim WCAG conformance of its own API.
  - regime: GDPR / CCPA-style consent and privacy assurance
    surface: cookie-privacy, tag-privacy and request-privacy report operations; consent-categories management
    evidence: >-
      openapi/observepoint-v3-api-openapi.yml — /v3/web-audits/{auditId}/runs/{runId}/reports/cookie-privacy,
      /reports/tag-privacy, /reports/request-privacy, and /v3/consent-categories
    note: Subject-matter coverage of privacy regimes, not a certification.
