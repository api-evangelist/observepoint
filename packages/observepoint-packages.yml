  note: >-
    ObservePoint publishes NO first-party client SDK on any package registry. npm, PyPI, RubyGems,
    crates.io and Packagist all return zero ObservePoint-owned packages (npm's only near-match,
    "tracklint", belongs to an unrelated GitHub user). The published docs teach the API with raw curl
    and a plain `requests` example rather than a client library. The one first-party distributable is a
    GitHub Action for triggering audits from CI/CD, distributed from the GitHub repo (and Marketplace),
    not from a language registry — so it is recorded here as a package but NOT as an SDK, and no
    `type: SDKs` pointer is emitted in apis.yml.
