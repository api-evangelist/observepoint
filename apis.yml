aid: observepoint
name: ObservePoint
description: >-
  ObservePoint is a web governance and digital data-quality platform that automatically scans websites, mobile web
  properties and email links to validate analytics tags, marketing pixels, cookies, consent banners, link integrity and
  WCAG accessibility. Customers configure Audits (large-scale crawls of a site) and Web Journeys (scripted multi-step
  user paths), run them on a schedule or on demand, and get back structured reports on tags, variables, cookies,
  network requests, browser logs, privacy exposure and accessibility issues. Everything in the product is available
  through a public REST API at api.observepoint.com across two supported versions (v2 and v3) plus a Grid Reporting
  API that returns any report as rows and columns with filtering, sorting, grouping, pagination and export. API access
  is included with every ObservePoint subscription at no additional cost, and audits and journeys can push completion
  webhooks (HMAC-SHA256 signed) into CI/CD pipelines, BI tools and ticketing systems.
