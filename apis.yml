- name: ObservePoint Grid Reporting API
  description: >-
    The fastest and most flexible way to read ObservePoint results data. A single POST endpoint per grid entity type
    returns report data in row/column form with filters, operators, multi-column sorting, group mode with aggregate
    functions, and pagination up to 10,000 records per page across datasets of billions of rows. Includes a schema
    endpoint that lists available columns and types, saved report configurations, and asynchronous Excel/file exports.
  humanURL: https://api-docs.observepoint.com/sections/grid-api-intro
  baseURL: https://api.observepoint.com
  tags:
  - Web Governance
  - Reporting
  - Data Quality
  - Digital Analytics
  tags_raw:
