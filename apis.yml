apis:
- name: ObservePoint V3 API
  description: >-
    The current, preferred ObservePoint REST API. 283 operations covering web audits and their runs, page/tag/cookie/
    variable/browser-log/privacy reports, exports and scheduled exports, alerts, consent categories, action sets,
    web journeys and journey runs, email inboxes and email link validation, site censuses, custom header groups,
    remote file mappings, data sources, geo-locations, user events and webhook secret rotation. Authenticated with a
    user-level API key passed as `Authorization: api_key <key>`.
  humanURL: https://api-docs.observepoint.com/sections/v3-index
  baseURL: https://api.observepoint.com
