- name: ObservePoint V2 API
  description: >-
    The legacy but fully supported v2 REST API, served from https://api.observepoint.com/v2. 88 operations covering
    account, users, folders and sub-folders (domains), labels, tag and variable rules, tag definitions, web audits and
    audit runs, and manual journeys with their runs and actions. ObservePoint states that both v2 and v3 are fully
    supported with no plans for deprecation; v3 is preferred for new work because of better pagination and filtering.
  humanURL: https://api-docs.observepoint.com/sections/v2-index
  baseURL: https://api.observepoint.com/v2
  tags:
  - Web Governance
  - Website Auditing
  - Tag Management
  - Account Management
