data_lifecycle:
  results_retention_default: 13 months
  results_retention_options:
  - 3 years + 1 month
  - 5 years + 1 month
  - 7 years + 1 month
  configuration_retention: indefinite while the subscription is active
  post_cancellation: access-only read-only subscription available for retained results
  source: https://help.observepoint.com/en/articles/13161465-observepoint-data-retention
  note: >-
    This is the closest thing ObservePoint publishes to a data-lifecycle guarantee, and it bounds every
    reporting call: an agent querying runs older than the account's retention window gets nothing back.
