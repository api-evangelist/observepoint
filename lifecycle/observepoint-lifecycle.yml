versioning:
  scheme: major-version-in-path
  current_version: v3
  supported_versions:
  - v2
  - v3
  base_urls:
    v3: https://api.observepoint.com (paths prefixed /v3)
    v2: https://api.observepoint.com/v2
  policy_published: true
  quote: >-
    "ObservePoint currently has two supported versions of its API: v2 and v3. The two versions use the
    same authentication and rate limiting. Both versions of the API are fully supported and have no plans
    for deprecation. ... The v3 endpoints are generally preferred because they give you better control
    over pagination and filtering."
  source: https://api-docs.observepoint.com/
  note: >-
    Some capabilities exist only on one version — e.g. audit and journey CONFIGURATION is documented
    against v2 paths while most reporting lives on v3, and the webhook configuration doc still writes to
    POST/PUT /v2/web-audits and /v2/web-journeys. v2 is legacy in name only.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  notice_period: null
  note: >-
    ObservePoint publishes a statement that neither API version is planned for deprecation, but there is
    NO deprecation POLICY: no notice window, no Sunset/Deprecation response headers (RFC 8594), no
    deprecation register or migration guide. Two v3 operations are flagged `deprecated: true` inside the
    spec with no replacement named and no removal date. Because no policy exists, no `Deprecation`
    pointer is emitted in apis.yml.
  deprecated_operations:
